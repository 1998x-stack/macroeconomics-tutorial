<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="t d"><title id="t">GDP支出分类的数量示例</title><desc id="d">消费60、投资20、政府购买25、净出口-5，GDP=100，净出口负值画为扣减。</desc><defs><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147d80"/></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#cd7355"/></marker></defs><rect width="920" height="510" rx="20" fill="#fffdfa" stroke="#dce5e3"/><text x="65" y="133" font-family="sans-serif" font-size="19" fill="#21363c" text-anchor="start">消费 C</text><rect x="270" y="100" width="420" height="47" rx="6" fill="#147d80"/><text x="699" y="132" font-family="sans-serif" font-size="18" fill="#147d80" text-anchor="start">60</text><text x="65" y="223" font-family="sans-serif" font-size="19" fill="#21363c" text-anchor="start">投资 I</text><rect x="270" y="190" width="140" height="47" rx="6" fill="#7660a6"/><text x="419" y="222" font-family="sans-serif" font-size="18" fill="#7660a6" text-anchor="start">20</text><text x="65" y="313" font-family="sans-serif" font-size="19" fill="#21363c" text-anchor="start">政府 G</text><rect x="270" y="280" width="175" height="47" rx="6" fill="#cd7355"/><text x="454" y="312" font-family="sans-serif" font-size="18" fill="#cd7355" text-anchor="start">25</text><text x="65" y="405" font-family="sans-serif" font-size="19" fill="#21363c" text-anchor="start">净出口 NX</text><rect x="235" y="374" width="35" height="48" fill="#a18243"/><text x="220" y="405" font-family="sans-serif" font-size="19" fill="#a18243" text-anchor="end">−5</text><text x="460" y="478" font-family="sans-serif" font-size="29" fill="#147d80" text-anchor="middle">60 + 20 + 25 − 5 = 100</text></svg>