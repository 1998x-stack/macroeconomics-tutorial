<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="t d"><title id="t">中国修订后的货币层次关系</title><desc id="d">M0流通中现金，M1扩展到单位及个人活期存款和非银支付机构客户备付金，M2更广义。</desc><defs><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147d80"/></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#cd7355"/></marker></defs><rect width="920" height="510" rx="20" fill="#fffdfa" stroke="#dce5e3"/><rect x="47" y="85" width="826" height="330" rx="20" fill="#f2effa" stroke="#7660a6" stroke-width="2"/><rect x="94" y="132" width="732" height="228" rx="18" fill="#e6f3f0" stroke="#147d80" stroke-width="2"/><rect x="150" y="178" width="205" height="137" rx="16" fill="#fff9eb" stroke="#a18243" stroke-width="2"/><text x="250" y="235" font-family="sans-serif" font-size="38" fill="#9c793e" text-anchor="middle">M0</text><text x="250" y="268" font-family="sans-serif" font-size="18" fill="#21363c" text-anchor="middle">流通中现金</text><text x="560" y="191" font-family="sans-serif" font-size="24" fill="#147d80" text-anchor="middle">M1 = M0 +</text><text x="569" y="229" font-family="sans-serif" font-size="19" fill="#21363c" text-anchor="middle">单位活期 + 个人活期</text><text x="567" y="266" font-family="sans-serif" font-size="19" fill="#21363c" text-anchor="middle">支付机构客户备付金</text><text x="462" y="108" font-family="sans-serif" font-size="21" fill="#7660a6" text-anchor="middle">M2：更广义的货币及准货币</text><text x="462" y="457" font-family="sans-serif" font-size="19" fill="#5b6d72" text-anchor="middle">中国 M1 口径自 2025 年 1 月统计数据起修订</text></svg>