<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="t d"><title id="t">沿IS移动与IS曲线平移</title><desc id="d">利率上升是既定IS上的移动，自主支出增加则使每个给定利率对应更高Y。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker><marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#cd7355"/></marker></defs><rect width="920" height="480" rx="18" fill="#fffdf9"/><rect x="42" y="103" width="383" height="134" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="233.5" y="143" fill="#21363c" font-family="sans-serif" font-size="24" text-anchor="middle">利率改变</text><text x="233.5" y="178" fill="#5b6d72" font-family="sans-serif" font-size="17" text-anchor="middle">A 不变，沿 IS 移动</text><rect x="498" y="103" width="383" height="134" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="689.5" y="143" fill="#21363c" font-family="sans-serif" font-size="24" text-anchor="middle">自主支出改变</text><text x="689.5" y="178" fill="#5b6d72" font-family="sans-serif" font-size="17" text-anchor="middle">给定 r，IS 整体移动</text><path d="M234 240L234 297" stroke="#147d80" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M688 240L688 297" stroke="#cd7355" stroke-width="3" fill="none" marker-end="url(#arr2)"/><text x="234" y="351" fill="#147d80" font-family="sans-serif" font-size="23" text-anchor="middle">利率 ↑  → Y ↓</text><text x="688" y="351" fill="#cd7355" font-family="sans-serif" font-size="22" text-anchor="middle">支出 A ↑  → 同一 r 下 Y ↑</text><text x="460" y="419" fill="#5b6d72" font-family="sans-serif" font-size="18" text-anchor="middle">要判断挤出，还需加入利率如何内生决定的机制</text></svg>