<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">偿付能力与现金流动性是不同风险</title><desc id="d">银行资产100、负债92、权益8，资产损失5后权益3；短期现金兑付又属于流动性问题。</desc><rect width="920" height="490" rx="19" fill="#fffdfa" stroke="#dce5e3"/><rect x="42" y="83" width="393" height="143" rx="13" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="238.5" y="122" fill="#21363c" font-family="system-ui,sans-serif" text-anchor="middle" font-size="23">期初资产与负债</text><text x="238.5" y="159" fill="#5b6d72" font-family="system-ui,sans-serif" text-anchor="middle" font-size="16">100 = 92 + 8</text><rect x="493" y="83" width="393" height="143" rx="13" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="689.5" y="122" fill="#21363c" font-family="system-ui,sans-serif" text-anchor="middle" font-size="23">资产减值后</text><text x="689.5" y="159" fill="#5b6d72" font-family="system-ui,sans-serif" text-anchor="middle" font-size="16">95 = 92 + 3</text><text x="462" y="315" fill="#cd7355" font-family="system-ui,sans-serif" text-anchor="middle" font-size="29">权益减少 5/8 = 62.5%</text><text x="462" y="421" fill="#5b6d72" font-family="system-ui,sans-serif" text-anchor="middle" font-size="19">正权益不能保证随时变现资产支付全部到期款</text></svg>