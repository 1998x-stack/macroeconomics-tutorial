<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">经济活动围绕趋势的不规则周期</title><desc id="d">周期不是规则正弦波，扩张和收缩的长度不相等，转折点由多指标综合判断。</desc><rect width="920" height="490" rx="20" fill="#fffdf9" stroke="#dce5e3"/><path d="M55 365H875" stroke="#657a7b" stroke-width="2"/><path d="M55 275Q180 225 310 180T560 95T875 30" stroke="#9aa9a6" stroke-width="3" fill="none" stroke-dasharray="7 6"/><path d="M55 276Q115 165 180 208T310 130T420 230T560 98T660 180T770 63T875 110" stroke="#147f80" stroke-width="4" fill="none"/><text x="180" y="410" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">扩张</text><text x="330" y="410" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#d06d4d">收缩</text><text x="505" y="410" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">复苏</text><text x="710" y="410" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">再扩张</text><text x="460" y="455" font-size="17" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">示意波动与长期趋势；非真实GDP序列</text></svg>