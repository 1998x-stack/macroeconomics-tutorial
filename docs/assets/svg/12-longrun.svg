<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc"><title id="title">短期调整与长期潜在供给</title><desc id="desc">短期名义工资价格调整不充分，长期生产率资本劳动驱动潜在产出；实际调整时间非固定。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker></defs><rect width="920" height="500" rx="18" fill="#fffdf9" stroke="#dce5e3"/><rect x="45" y="99" width="270" height="135" rx="14" stroke="#147d80" stroke-width="2" fill="#e4f2ed"/><text x="180" y="138" font-size="23" font-family="system-ui,'PingFang SC',sans-serif" fill="#21363c" text-anchor="middle">短期</text><text x="180" y="172" font-size="16" font-family="system-ui,'PingFang SC',sans-serif" fill="#5b6d72" text-anchor="middle">工资与价格部分黏性</text><rect x="334" y="99" width="270" height="135" rx="14" stroke="#cd7355" stroke-width="2" fill="#fff0e9"/><text x="469" y="138" font-size="23" font-family="system-ui,'PingFang SC',sans-serif" fill="#21363c" text-anchor="middle">中期</text><text x="469" y="172" font-size="16" font-family="system-ui,'PingFang SC',sans-serif" fill="#5b6d72" text-anchor="middle">预期与合同逐步重设</text><rect x="623" y="99" width="270" height="135" rx="14" stroke="#7660a6" stroke-width="2" fill="#f0eef9"/><text x="758" y="138" font-size="23" font-family="system-ui,'PingFang SC',sans-serif" fill="#21363c" text-anchor="middle">长期</text><text x="758" y="172" font-size="16" font-family="system-ui,'PingFang SC',sans-serif" fill="#5b6d72" text-anchor="middle">技术资本劳动影响Y*</text><path d="M316 168L331 168" stroke="#147d80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M608 168L620 168" stroke="#147d80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="177" y="326" font-size="18" font-family="system-ui,'PingFang SC',sans-serif" fill="#21363c" text-anchor="middle">实际产出可偏离潜在</text><text x="468" y="326" font-size="18" font-family="system-ui,'PingFang SC',sans-serif" fill="#21363c" text-anchor="middle">价格与工资开始调整</text><text x="756" y="326" font-size="18" font-family="system-ui,'PingFang SC',sans-serif" fill="#21363c" text-anchor="middle">潜在产出也会变化</text><text x="461" y="414" font-size="19" font-family="system-ui,'PingFang SC',sans-serif" fill="#5b6d72" text-anchor="middle">不应把长期简单理解为某个固定的年数</text></svg>