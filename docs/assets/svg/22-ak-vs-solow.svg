<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">AK与索洛资本积累路径的差异</title><desc id="d">索洛模型中资本边际产出递减，AK模型把广义资本回报设为不递减。</desc><rect width="920" height="490" rx="20" fill="#fffdf9" stroke="#dce5e3"/><path d="M90 56V406H850" stroke="#657a7b" stroke-width="2" fill="none"/><path d="M98 390Q230 120 820 95" fill="none" stroke="#147f80" stroke-width="5"/><path d="M98 390L820 64" fill="none" stroke="#d06d4d" stroke-width="5" stroke-dasharray="9 6"/><text x="692" y="125" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#147f80">索洛：边际回报递减</text><text x="660" y="56" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#d06d4d">AK：广义资本恒定回报</text><text x="464" y="455" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">资本积累时间路径与稳态性质取决于生产函数假设</text></svg>