<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">中央银行购买商业银行证券的双重记账</title><desc id="d">央行资产证券+100负债准备金+100，商业银行证券资产-100而准备金+100。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker></defs><rect width="920" height="490" rx="20" fill="#fffdfa"/><rect x="48" y="92" width="401" height="125" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="248.5" y="133" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" fill="#21363c" text-anchor="middle">央行资产</text><text x="248.5" y="166" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#5b6d72" text-anchor="middle">证券 +100</text><rect x="468" y="92" width="401" height="125" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="668.5" y="133" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" fill="#21363c" text-anchor="middle">央行负债</text><text x="668.5" y="166" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#5b6d72" text-anchor="middle">准备金 +100</text><rect x="48" y="290" width="401" height="125" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="248.5" y="331" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" fill="#21363c" text-anchor="middle">商业银行资产</text><text x="248.5" y="364" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#5b6d72" text-anchor="middle">证券 −100</text><rect x="468" y="290" width="401" height="125" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="668.5" y="331" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" fill="#21363c" text-anchor="middle">商业银行资产</text><text x="668.5" y="364" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#5b6d72" text-anchor="middle">准备金 +100</text><text x="461" y="456" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#5b6d72" text-anchor="middle">资产置换并不自动让商业银行新增贷款</text></svg>