<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">平均托宾q的简化比值</title><desc id="d">市场价值130、重置成本100时平均q=1.3，但不是每次新增投资的边际q。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker></defs><rect width="920" height="490" rx="20" fill="#fffdfa"/><rect x="52" y="105" width="379" height="135" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="241.5" y="146" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" fill="#21363c" text-anchor="middle">市场评价</text><text x="241.5" y="179" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#5b6d72" text-anchor="middle">130（构造值）</text><rect x="492" y="105" width="379" height="135" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="681.5" y="146" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" fill="#21363c" text-anchor="middle">重置成本</text><text x="681.5" y="179" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#5b6d72" text-anchor="middle">100（构造值）</text><text x="460" y="328" font-family="system-ui,'PingFang SC',sans-serif" font-size="29" fill="#147d80" text-anchor="middle">平均 q = 1.30</text><text x="460" y="417" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" fill="#5b6d72" text-anchor="middle">高平均 q 不保证每个新增项目盈利</text></svg>