<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">有效劳动标准化</title><desc id="d">资本K除以技术A与劳动L的乘积，得到每单位有效劳动资本k；稳态k不变并不意味着人均产出不增长。</desc><rect width="920" height="490" rx="20" fill="#fffdf9" stroke="#dce5e3"/><rect x="46" y="87" width="250" height="132" rx="14" fill="#e7f2ef" stroke="#147f80" stroke-width="2"/><text x="171" y="129" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">总资本 K</text><text x="171" y="165" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">机器、厂房与基础设施</text><rect x="337" y="87" width="250" height="132" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="462" y="129" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">有效劳动 AL</text><text x="462" y="165" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">劳动人数 × 劳动效率</text><rect x="628" y="87" width="245" height="132" rx="14" fill="#f1eef9" stroke="#7461ba" stroke-width="2"/><text x="750.5" y="129" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">资本深度 k</text><text x="750.5" y="165" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">K / (A × L)</text><text x="460" y="306" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">k 稳态：每单位有效劳动资本不变</text><text x="460" y="390" font-size="19" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">总产出增长约 n+g；人均产出增长约 g</text></svg>