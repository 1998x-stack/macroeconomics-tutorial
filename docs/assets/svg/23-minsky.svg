<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">Minsky融资结构从稳健到脆弱的变化</title><desc id="d">套期融资现金流可覆盖利息和本金；投机融资需要续借本金；Ponzi融资连利息也无法靠现金流覆盖。</desc><rect width="920" height="490" rx="20" fill="#fffdf9" stroke="#dce5e3"/><rect x="35" y="98" width="270" height="142" rx="14" fill="#e7f2ef" stroke="#147f80" stroke-width="2"/><text x="170" y="140" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">套期融资</text><text x="170" y="176" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">现金流覆盖利息 + 本金</text><rect x="325" y="98" width="270" height="142" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="460" y="140" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">投机融资</text><text x="460" y="176" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">现金流覆盖利息；本金需续借</text><rect x="615" y="98" width="270" height="142" rx="14" fill="#f1eef9" stroke="#7461ba" stroke-width="2"/><text x="750" y="140" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">Ponzi融资</text><text x="750" y="176" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">现金流不足以支付利息</text><text x="460" y="332" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">对再融资和资产价格的依赖逐步增加</text><text x="460" y="413" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">概念分类，不是银行监管资本比率</text></svg>