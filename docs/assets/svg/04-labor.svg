<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="t d"><title id="t">劳动力人口分组</title><desc id="d">总人口样本100人，其中就业60，失业5，非劳动力35；劳动力65、失业率5/65约7.69%。</desc><defs><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147d80"/></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#cd7355"/></marker></defs><rect width="920" height="510" rx="20" fill="#fffdfa" stroke="#dce5e3"/><rect x="290" y="52" width="340" height="104" rx="14" fill="#e5f3f0" stroke="#147d80" stroke-width="2"/><text x="460" y="97" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">相关人口 100</text><text x="460" y="131" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">观察总体</text><path d="M460 159 L460 220" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#teal)"/><rect x="65" y="245" width="238" height="122" rx="14" fill="#e5f3f0" stroke="#147d80" stroke-width="2"/><text x="184" y="290" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">就业 60</text><text x="184" y="324" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">劳动力之一</text><rect x="343" y="245" width="238" height="122" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="462" y="290" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">失业 5</text><text x="462" y="324" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">劳动力之一</text><rect x="621" y="245" width="238" height="122" rx="14" fill="#f2eefb" stroke="#7660a6" stroke-width="2"/><text x="740" y="290" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">非劳动力 35</text><text x="740" y="324" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">不计入失业分母</text><text x="460" y="433" font-family="sans-serif" font-size="25" fill="#147d80" text-anchor="middle">劳动力 = 60 + 5 = 65</text><text x="460" y="472" font-family="sans-serif" font-size="21" fill="#21363c" text-anchor="middle">失业率 = 5 ÷ 65 ≈ 7.69%（构造示例）</text></svg>