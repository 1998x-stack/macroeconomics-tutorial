<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">两种汇率制度下政策传导的简化对照</title><desc id="d">固定汇率下利率受锚约束，浮动汇率下汇率可经净出口反馈，财政和货币效应依资本流动和价格黏性变化。</desc><rect width="920" height="490" rx="20" fill="#fffdfa" stroke="#dce5e3"/><rect x="49" y="104" width="389" height="153" rx="13" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="243.5" y="145" font-size="23" fill="#21363c" text-anchor="middle" font-family="system-ui,sans-serif">浮动汇率</text><text x="243.5" y="181" font-size="16" fill="#5b6d72" text-anchor="middle" font-family="system-ui,sans-serif">利率 → 汇率 → 净出口</text><rect x="486" y="104" width="389" height="153" rx="13" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="680.5" y="145" font-size="23" fill="#21363c" text-anchor="middle" font-family="system-ui,sans-serif">固定汇率</text><text x="680.5" y="181" font-size="16" fill="#5b6d72" text-anchor="middle" font-family="system-ui,sans-serif">盯住锚与资本流动约束</text><text x="460" y="337" font-size="21" fill="#21363c" text-anchor="middle" font-family="system-ui,sans-serif">财政与货币政策的效果依制度闭合条件而变化</text><text x="460" y="416" font-size="18" fill="#5b6d72" text-anchor="middle" font-family="system-ui,sans-serif">真实世界还涉及风险溢价、外汇干预与市场摩擦</text></svg>