<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">自动稳定器缓冲可支配收入</title><desc id="d">工资变化与既定税负和失业保障之间的机制连接，非真实税率。</desc><rect width="920" height="490" rx="18" fill="#fffdfa" stroke="#dce5e3"/><rect x="49" y="94" width="380" height="130" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="239" y="136" font-size="23" text-anchor="middle" font-family="system-ui,sans-serif" fill="#21363c">经济衰退</text><text x="239" y="171" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#5b6d72">劳动收入与企业利润减少</text><rect x="488" y="94" width="383" height="130" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="679.5" y="136" font-size="23" text-anchor="middle" font-family="system-ui,sans-serif" fill="#21363c">税制与保障规则</text><text x="679.5" y="171" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#5b6d72">税款下降 / 合资格给付增加</text><rect x="278" y="328" width="365" height="114" rx="14" fill="#f1eef9" stroke="#7660a6" stroke-width="2"/><text x="460.5" y="370" font-size="23" text-anchor="middle" font-family="system-ui,sans-serif" fill="#21363c">家庭现金流</text><text x="460.5" y="405" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#5b6d72">可支配收入跌幅部分缓冲</text><text x="458" y="279" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#21363c">税务与社保规则因国家而异</text></svg>