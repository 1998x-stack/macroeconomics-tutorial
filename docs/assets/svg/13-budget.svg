<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc"><title id="title">两期预算线与最优平滑的图形</title><desc id="desc">r=0、Y1+Y2=200时，预算线连接(0,200)与(200,0)，两期均消费100在中点。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker></defs><rect width="920" height="500" rx="18" fill="#fffdf9" stroke="#dce5e3"/><path d="M128 65V403H834" stroke="#567177" stroke-width="3" fill="none"/><path d="M160 77L796 383" stroke="#147d80" stroke-width="5"/><circle cx="478" cy="230" r="10" fill="#cd7355"/><text x="502" y="218" font-size="22" font-family="system-ui,'PingFang SC',sans-serif" fill="#cd7355" text-anchor="start">(100,100)</text><text x="765" y="450" font-size="22" font-family="system-ui,'PingFang SC',sans-serif" fill="#21363c" text-anchor="middle">C₁ →</text><text x="122" y="49" font-size="22" font-family="system-ui,'PingFang SC',sans-serif" fill="#21363c" text-anchor="start">C₂ ↑</text><text x="477" y="85" font-size="21" font-family="system-ui,'PingFang SC',sans-serif" fill="#147d80" text-anchor="middle">C₁+C₂=200</text></svg>