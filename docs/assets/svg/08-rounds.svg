<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">收入乘数的逐轮传播</title><desc id="desc">自主需求增加10，边际消费倾向0.6，后续收入增加为10、6、3.6、2.16……总和趋近25。</desc><defs><marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker><marker id="orange" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#cd7355"/></marker></defs><rect width="920" height="480" rx="20" fill="#fffdf9"/><text x="82" y="113" font-family="sans-serif" font-size="20" text-anchor="start" fill="#21363c">第0轮</text><rect x="203" y="79" width="470" height="43" rx="5" fill="#147d80"/><text x="689" y="107" font-family="sans-serif" font-size="18" text-anchor="start" fill="#21363c">10.00</text><text x="82" y="190" font-family="sans-serif" font-size="20" text-anchor="start" fill="#21363c">第1轮</text><rect x="203" y="156" width="282" height="43" rx="5" fill="#cd7355"/><text x="501" y="184" font-family="sans-serif" font-size="18" text-anchor="start" fill="#21363c">6.00</text><text x="82" y="267" font-family="sans-serif" font-size="20" text-anchor="start" fill="#21363c">第2轮</text><rect x="203" y="233" width="169.20000000000002" height="43" rx="5" fill="#147d80"/><text x="388.20000000000005" y="261" font-family="sans-serif" font-size="18" text-anchor="start" fill="#21363c">3.60</text><text x="82" y="344" font-family="sans-serif" font-size="20" text-anchor="start" fill="#21363c">第3轮</text><rect x="203" y="310" width="101.52000000000001" height="43" rx="5" fill="#cd7355"/><text x="320.52" y="338" font-family="sans-serif" font-size="18" text-anchor="start" fill="#21363c">2.16</text><text x="460" y="433" font-family="sans-serif" font-size="21" text-anchor="middle" fill="#5b6d72">前四轮合计21.76；所有轮次收敛到25.00</text></svg>