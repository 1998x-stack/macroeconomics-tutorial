<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="t d"><title id="t">固定消费篮子CPI示例</title><desc id="d">2个苹果和1袋米，基期8元，报告期10元，构造 CPI 125。</desc><defs><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147d80"/></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#cd7355"/></marker></defs><rect width="920" height="510" rx="20" fill="#fffdfa" stroke="#dce5e3"/><text x="55" y="70" font-family="sans-serif" font-size="21" fill="#21363c" text-anchor="start">同一数量篮子，两组价格</text><text x="64" y="163" font-family="sans-serif" font-size="20" fill="#21363c" text-anchor="start">苹果 × 2</text><rect x="266" y="125" width="180" height="42" rx="6" fill="#147d80"/><rect x="266" y="175" width="270" height="42" rx="6" fill="#cd7355"/><text x="466" y="154" font-family="sans-serif" font-size="16" fill="#147d80" text-anchor="start">基期 4</text><text x="556" y="204" font-family="sans-serif" font-size="16" fill="#cd7355" text-anchor="start">报告期 6</text><text x="64" y="299" font-family="sans-serif" font-size="20" fill="#21363c" text-anchor="start">米 × 1</text><rect x="266" y="261" width="180" height="42" rx="6" fill="#147d80"/><rect x="266" y="311" width="180" height="42" rx="6" fill="#cd7355"/><text x="466" y="290" font-family="sans-serif" font-size="16" fill="#147d80" text-anchor="start">基期 4</text><text x="466" y="340" font-family="sans-serif" font-size="16" fill="#cd7355" text-anchor="start">报告期 4</text><text x="460" y="457" font-family="sans-serif" font-size="26" fill="#21363c" text-anchor="middle">篮子成本 8 → 10    CPI 100 → 125</text></svg>