<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">购买非银行证券时结算路径为何不同</title><desc id="d">央行买自银行与买自非银行券持有人的资产负债表变化不同，非银行卖方往往获得存款债权。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker></defs><rect width="920" height="490" rx="20" fill="#fffdfa"/><rect x="45" y="100" width="396" height="140" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="243" y="141" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" fill="#21363c" text-anchor="middle">直接向银行买券</text><text x="243" y="174" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#5b6d72" text-anchor="middle">银行证券 −100 / 准备金 +100</text><rect x="479" y="100" width="396" height="140" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="677" y="141" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" fill="#21363c" text-anchor="middle">向非银行买券</text><text x="677" y="174" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#5b6d72" text-anchor="middle">银行准备金 +100 / 存款 +100</text><text x="239" y="320" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" fill="#147d80" text-anchor="middle">银行原有存款未必增加</text><text x="682" y="320" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" fill="#cd7355" text-anchor="middle">非银行卖方收到银行存款</text><text x="461" y="414" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#5b6d72" text-anchor="middle">资产购买与银行新发放客户贷款是不同交易</text></svg>