<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">通胀下降的两种不同可能机制</title><desc id="d">需求下降或供应成本恢复都可能缓解通胀，但对产出和失业的影响可能不同。</desc><rect width="920" height="490" rx="20" fill="#fffdfa" stroke="#dce5e3"/><rect x="53" y="111" width="372" height="144" rx="15" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><rect x="495" y="111" width="372" height="144" rx="15" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="241" y="159" font-family="system-ui,sans-serif" fill="#21363c" font-size="24" text-anchor="middle">需求收缩</text><text x="241" y="203" font-family="system-ui,sans-serif" fill="#21363c" font-size="18" text-anchor="middle">价格压力 ↓ / 产出可能 ↓</text><text x="681" y="159" font-family="system-ui,sans-serif" fill="#21363c" font-size="24" text-anchor="middle">供应链恢复</text><text x="681" y="203" font-family="system-ui,sans-serif" fill="#21363c" font-size="18" text-anchor="middle">价格压力 ↓ / 产出可能 ↑</text><text x="460" y="340" font-family="system-ui,sans-serif" fill="#21363c" font-size="22" text-anchor="middle">同样的通胀下降不一定伴随相同失业代价</text><text x="460" y="412" font-family="system-ui,sans-serif" fill="#5b6d72" font-size="18" text-anchor="middle">供需冲击、预期和政策反应共同决定经验结果</text></svg>