<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc"><title id="title">暂时收入与永久收入冲击的消费反应</title><desc id="desc">在两期无利息等额消费的构造例子里暂时+20带来每期消费+10，而连续两期各+20带来每期消费+20。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker></defs><rect width="920" height="500" rx="18" fill="#fffdf9" stroke="#dce5e3"/><rect x="42" y="86" width="402" height="150" rx="14" stroke="#147d80" stroke-width="2" fill="#e4f2ed"/><text x="243" y="125" font-size="23" font-family="system-ui,'PingFang SC',sans-serif" fill="#21363c" text-anchor="middle">仅第1期多20</text><text x="243" y="159" font-size="16" font-family="system-ui,'PingFang SC',sans-serif" fill="#5b6d72" text-anchor="middle">跨两期消费各 +10</text><rect x="480" y="86" width="398" height="150" rx="14" stroke="#cd7355" stroke-width="2" fill="#fff0e9"/><text x="679" y="125" font-size="23" font-family="system-ui,'PingFang SC',sans-serif" fill="#21363c" text-anchor="middle">两期均多20</text><text x="679" y="159" font-size="16" font-family="system-ui,'PingFang SC',sans-serif" fill="#5b6d72" text-anchor="middle">跨两期消费各 +20</text><text x="233" y="313" font-size="22" font-family="system-ui,'PingFang SC',sans-serif" fill="#147d80" text-anchor="middle">资源总额 +20</text><text x="675" y="313" font-size="22" font-family="system-ui,'PingFang SC',sans-serif" fill="#cd7355" text-anchor="middle">资源总额 +40</text><text x="460" y="420" font-size="18" font-family="system-ui,'PingFang SC',sans-serif" fill="#5b6d72" text-anchor="middle">比较的前提：利息为零、两期同权重、可自由借贷</text></svg>