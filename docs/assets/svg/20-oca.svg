<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">货币联盟收益与不对称冲击调整成本</title><desc id="d">共同货币减少汇兑交易成本，但各成员放弃独立名义利率与汇率；劳动力流动和财政风险共担可减弱不对称冲击损失。</desc><rect width="920" height="490" rx="20" fill="#fffdfa" stroke="#dce5e3"/><rect x="42" y="95" width="394" height="154" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="239" y="138" font-size="23" font-family="system-ui,sans-serif" text-anchor="middle" fill="#21363c">货币联盟的收益</text><text x="239" y="173" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">更低汇兑成本与共同定价</text><rect x="482" y="95" width="394" height="154" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="679" y="138" font-size="23" font-family="system-ui,sans-serif" text-anchor="middle" fill="#21363c">成员的政策代价</text><text x="679" y="173" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">失去各自名义汇率与利率</text><text x="460" y="336" font-size="21" font-family="system-ui,sans-serif" text-anchor="middle" fill="#21363c">缓冲渠道：劳动力流动 · 工资调整 · 财政共担</text><text x="460" y="411" font-size="18" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">是否合适取决于冲击对称性和制度安排</text></svg>