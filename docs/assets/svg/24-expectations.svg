<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">理性预期使用信息但不能消除未来冲击</title><desc id="d">预期是给定信息集下的条件期望，实际结果仍受到当时不可知的新冲击。</desc><rect width="920" height="490" rx="20" fill="#fffdf9" stroke="#dce5e3"/><rect x="45" y="92" width="254" height="143" rx="14" fill="#e7f2ef" stroke="#147f80" stroke-width="2"/><text x="172" y="134" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">信息集 I_t</text><text x="172" y="170" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">政策、数据、模型</text><rect x="333" y="92" width="254" height="143" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="460" y="134" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">条件预期</text><text x="460" y="170" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">E_t[π_{t+1}]</text><rect x="621" y="92" width="254" height="143" rx="14" fill="#f1eef9" stroke="#7461ba" stroke-width="2"/><text x="748" y="134" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">实际结果</text><text x="748" y="170" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">预期 + 新冲击</text><path d="M301 160H330M589 160H618" stroke="#147f80" stroke-width="4"/><text x="460" y="329" font-size="23" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">理性预期 ≠ 完美预言</text><text x="460" y="414" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">预测误差可存在，但不应被当时信息系统性预测</text></svg>