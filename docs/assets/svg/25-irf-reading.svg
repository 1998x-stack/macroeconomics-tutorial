<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">脉冲响应函数的正确阅读方式</title><desc id="d">IRF描述给定冲击后变量相对稳态的动态偏离；冲击单位、变量单位、参数和近似阶数决定解释。</desc><rect width="920" height="490" rx="20" fill="#fffdf9" stroke="#dce5e3"/><rect x="43" y="90" width="255" height="138" rx="14" fill="#e7f2ef" stroke="#147f80" stroke-width="2"/><text x="170.5" y="132" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">冲击定义</text><text x="170.5" y="168" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">一标准差 / 单位冲击</text><rect x="333" y="90" width="255" height="138" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="460.5" y="132" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">变量口径</text><text x="460.5" y="168" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">水平、对数点、百分点</text><rect x="623" y="90" width="255" height="138" rx="14" fill="#f1eef9" stroke="#7461ba" stroke-width="2"/><text x="750.5" y="132" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">求解方法</text><text x="750.5" y="168" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">一阶、二阶或非线性</text><text x="460" y="327" font-size="21" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">响应方向、幅度和持久性都依赖模型设定</text><text x="460" y="408" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">IRF不是自动识别出的历史因果效应</text></svg>