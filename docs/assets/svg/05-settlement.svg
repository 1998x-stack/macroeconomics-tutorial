<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="t d"><title id="t">跨行支付与准备金结算</title><desc id="d">贷款发放后支付给另一银行客户，A银行存款减少且通过清算转出准备金，B银行准备金增加且客户存款增加。</desc><defs><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147d80"/></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#cd7355"/></marker></defs><rect width="920" height="510" rx="20" fill="#fffdfa" stroke="#dce5e3"/><rect x="52" y="106" width="385" height="140" rx="14" fill="#e5f3f0" stroke="#147d80" stroke-width="2"/><text x="244.5" y="151" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">银行 A</text><text x="244.5" y="185" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">原始贷款资产 +100</text><rect x="482" y="106" width="385" height="140" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="674.5" y="151" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">银行 B</text><text x="674.5" y="185" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">收款客户存款 +100</text><path d="M438 175 L477 175" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#teal)"/><text x="460" y="154" font-family="sans-serif" font-size="17" fill="#147d80" text-anchor="middle">支付</text><text x="250" y="312" font-family="sans-serif" font-size="21" fill="#21363c" text-anchor="middle">A 的客户存款 −100</text><text x="675" y="312" font-family="sans-serif" font-size="21" fill="#21363c" text-anchor="middle">B 的客户存款 +100</text><path d="M440 368 L478 368" fill="none" stroke="#cd7355" stroke-width="3" marker-end="url(#rust)"/><text x="460" y="351" font-family="sans-serif" font-size="18" fill="#cd7355" text-anchor="middle">准备金转移</text><text x="460" y="451" font-family="sans-serif" font-size="19" fill="#5b6d72" text-anchor="middle">银行体系总量与单家银行流动性是两个问题</text></svg>