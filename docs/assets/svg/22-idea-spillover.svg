<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">新创意的私人收益与知识外溢</title><desc id="d">研发产生可被多人同时使用的知识；专利与商业秘密可提供部分排他性，但扩散会产生社会外部收益。</desc><rect width="920" height="490" rx="20" fill="#fffdf9" stroke="#dce5e3"/><rect x="44" y="91" width="254" height="140" rx="14" fill="#e7f2ef" stroke="#147f80" stroke-width="2"/><text x="171" y="133" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">研究团队</text><text x="171" y="169" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">投入人力与研发成本</text><rect x="333" y="91" width="254" height="140" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="460" y="133" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">新知识 A</text><text x="460" y="169" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">可重复使用，不被耗尽</text><rect x="622" y="91" width="254" height="140" rx="14" fill="#f1eef9" stroke="#7461ba" stroke-width="2"/><text x="749" y="133" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">产业扩散</text><text x="749" y="169" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">多家企业采用</text><path d="M300 160H330M590 160H619" stroke="#147f80" stroke-width="4" fill="none"/><text x="460" y="322" font-size="20" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">私人收益：许可、先发优势、商业化利润</text><text x="460" y="405" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">社会收益：模仿、人员流动、跨行业知识外溢</text></svg>