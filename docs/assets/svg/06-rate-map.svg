<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">利率传导不是一个单一数字</title><desc id="desc">政策利率通过资金成本、市场收益率、信贷风险等渠道影响私人支出，箭头表示概念性可能渠道。</desc><defs><marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker><marker id="orange" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#cd7355"/></marker></defs><rect width="920" height="480" rx="20" fill="#fffdf9"/><rect x="70" y="75" width="255" height="118" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="197.5" y="118" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#21363c">中央银行</text><text x="197.5" y="152" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#526a70">政策操作利率</text><rect x="590" y="75" width="255" height="118" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="717.5" y="118" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#21363c">市场利率</text><text x="717.5" y="152" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#526a70">国债与资金市场</text><path d="M327 133L583 133" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="265" width="255" height="118" rx="14" fill="#f1eef9" stroke="#7660a6" stroke-width="2"/><text x="197.5" y="308" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#21363c">银行信贷</text><text x="197.5" y="342" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#526a70">合同利率与额度</text><rect x="590" y="265" width="255" height="118" rx="14" fill="#fff6e6" stroke="#a18243" stroke-width="2"/><text x="717.5" y="308" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#21363c">家庭与企业</text><text x="717.5" y="342" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#526a70">消费、投资决策</text><path d="M592 336L327 336" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#arrow)"/><text x="455" y="225" font-family="sans-serif" font-size="19" text-anchor="middle" fill="#5b6d72">价格、风险、预期和合同条款同时影响传导</text><text x="455" y="433" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#5b6d72">利率变化 ≠ 实际产出必定按同一比例变化</text></svg>