<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">名义汇率E采用本币每外币的报价方向</title><desc id="d">E从7元每美元变成7.5元每美元是人民币相对于美元的名义贬值，若用反向报价则方向相反。</desc><rect width="920" height="490" rx="20" fill="#fffdfa" stroke="#dce5e3"/><rect x="47" y="109" width="379" height="142" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="236.5" y="152" font-size="23" font-family="system-ui,sans-serif" text-anchor="middle" fill="#21363c">E = 7.0</text><text x="236.5" y="187" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">1美元可兑换7.0元人民币</text><rect x="495" y="109" width="379" height="142" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="684.5" y="152" font-size="23" font-family="system-ui,sans-serif" text-anchor="middle" fill="#21363c">E = 7.5</text><text x="684.5" y="187" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">1美元可兑换7.5元人民币</text><text x="460" y="329" font-size="22" font-family="system-ui,sans-serif" text-anchor="middle" fill="#21363c">E 上升 → 每美元需要更多本币 → 本币名义贬值</text><text x="460" y="411" font-size="18" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">把报价取倒数后必须同时反转方向解释</text></svg>