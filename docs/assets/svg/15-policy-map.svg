<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">政策目标与市场传导的五层分解</title><desc id="d">宏观政策目标、短期政策目标利率、实施工具、市场利率、实体借款与消费投资之间有多个步骤。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker></defs><rect width="920" height="490" rx="20" fill="#fffdfa"/><rect x="13" y="145" width="166" height="120" rx="12" fill="#e3f2ed" stroke="#147d80" stroke-width="2"/><text x="96" y="193" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" fill="#21363c" text-anchor="middle">宏观目标</text><text x="96" y="229" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#5b6d72" text-anchor="middle">价格与就业</text><path d="M180 203L191 203" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#a)"/><rect x="194" y="145" width="166" height="120" rx="12" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="277" y="193" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" fill="#21363c" text-anchor="middle">政策目标区间</text><text x="277" y="229" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#5b6d72" text-anchor="middle">政策立场</text><path d="M361 203L372 203" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#a)"/><rect x="375" y="145" width="166" height="120" rx="12" fill="#e3f2ed" stroke="#147d80" stroke-width="2"/><text x="458" y="193" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" fill="#21363c" text-anchor="middle">操作工具</text><text x="458" y="229" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#5b6d72" text-anchor="middle">IORB / ON RRP</text><path d="M542 203L553 203" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#a)"/><rect x="556" y="145" width="166" height="120" rx="12" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="639" y="193" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" fill="#21363c" text-anchor="middle">金融市场</text><text x="639" y="229" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#5b6d72" text-anchor="middle">信用与期限</text><path d="M723 203L734 203" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#a)"/><rect x="737" y="145" width="166" height="120" rx="12" fill="#e3f2ed" stroke="#147d80" stroke-width="2"/><text x="820" y="193" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" fill="#21363c" text-anchor="middle">实体支出</text><text x="820" y="229" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#5b6d72" text-anchor="middle">消费和投资</text><text x="460" y="362" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" fill="#21363c" text-anchor="middle">政策目标利率不等于每个企业的合同借款利率</text><text x="460" y="419" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#5b6d72" text-anchor="middle">传导速度由制度、融资风险、合同期限和预期共同决定</text></svg>