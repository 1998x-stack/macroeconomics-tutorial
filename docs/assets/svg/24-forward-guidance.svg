<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">未来利率沟通通过长期利率预期影响当前金融条件</title><desc id="d">前瞻指引改变市场对未来短期利率的预期，可能传导到长期收益率、按揭和企业融资成本。</desc><rect width="920" height="490" rx="20" fill="#fffdf9" stroke="#dce5e3"/><rect x="43" y="92" width="256" height="139" rx="14" fill="#e7f2ef" stroke="#147f80" stroke-width="2"/><text x="171" y="134" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">央行沟通</text><text x="171" y="170" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">未来政策路径或条件</text><rect x="332" y="92" width="256" height="139" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="460" y="134" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">市场预期</text><text x="460" y="170" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">未来短期利率路径</text><rect x="620" y="92" width="256" height="139" rx="14" fill="#f1eef9" stroke="#7461ba" stroke-width="2"/><text x="748" y="134" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">当前金融条件</text><text x="748" y="170" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">长期收益率与资产价格</text><path d="M300 160H328M589 160H616" stroke="#147f80" stroke-width="4"/><text x="460" y="322" font-size="21" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">沟通的效果依赖可信度、状态和风险溢价</text><text x="460" y="407" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">前瞻指引不是对未来每次会议的无条件保证</text></svg>