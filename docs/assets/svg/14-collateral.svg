<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">抵押资产下降导致贷款额度不足</title><desc id="d">投资100内部现金30需融资70；抵押品跌至80，LTV80%时额度64，产生资金缺口6。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker></defs><rect width="920" height="490" rx="20" fill="#fffdfa"/><rect x="35" y="100" width="270" height="126" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="170" y="141" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" fill="#21363c" text-anchor="middle">项目总成本</text><text x="170" y="174" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#5b6d72" text-anchor="middle">100</text><rect x="324" y="100" width="270" height="126" rx="14" fill="#f0eef9" stroke="#7660a6" stroke-width="2"/><text x="459" y="141" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" fill="#21363c" text-anchor="middle">自有资金</text><text x="459" y="174" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#5b6d72" text-anchor="middle">30</text><rect x="611" y="100" width="270" height="126" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="746" y="141" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" fill="#21363c" text-anchor="middle">需外借</text><text x="746" y="174" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#5b6d72" text-anchor="middle">70</text><text x="460" y="311" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" fill="#21363c" text-anchor="middle">抵押品：100 → 80    可贷额度：80 → 64</text><text x="460" y="373" font-family="system-ui,'PingFang SC',sans-serif" font-size="28" fill="#cd7355" text-anchor="middle">缺口：70 − 64 = 6</text><text x="460" y="440" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#5b6d72" text-anchor="middle">正净现值仍可能受到资金约束</text></svg>