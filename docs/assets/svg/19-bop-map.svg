<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">IMF国际收支账户的层次</title><desc id="d">经常账户含货物服务和两种收入；资本账户与金融账户使用不同的统计流量，金融账户用资产净取得减负债净发生。</desc><rect width="920" height="490" rx="20" fill="#fffdfa" stroke="#dce5e3"/><rect x="36" y="76" width="267" height="139" rx="13" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="169.5" y="117" font-size="23" fill="#21363c" text-anchor="middle" font-family="system-ui,sans-serif">经常账户 CA</text><text x="169.5" y="153" font-size="16" fill="#5b6d72" text-anchor="middle" font-family="system-ui,sans-serif">货物服务、初次与二次收入</text><rect x="329" y="76" width="267" height="139" rx="13" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="462.5" y="117" font-size="23" fill="#21363c" text-anchor="middle" font-family="system-ui,sans-serif">资本账户 KA</text><text x="462.5" y="153" font-size="16" fill="#5b6d72" text-anchor="middle" font-family="system-ui,sans-serif">资本转移与非生产资产</text><rect x="626" y="76" width="260" height="139" rx="13" fill="#f1eef9" stroke="#7660a6" stroke-width="2"/><text x="756" y="117" font-size="23" fill="#21363c" text-anchor="middle" font-family="system-ui,sans-serif">金融账户 FA</text><text x="756" y="153" font-size="16" fill="#5b6d72" text-anchor="middle" font-family="system-ui,sans-serif">金融资产取得−负债发生</text><text x="460" y="304" font-size="23" fill="#21363c" text-anchor="middle" font-family="system-ui,sans-serif">CA + KA = 对外净借贷 = FA（不计误差遗漏）</text><text x="460" y="391" font-size="18" fill="#5b6d72" text-anchor="middle" font-family="system-ui,sans-serif">BPM7 已发布，但统计机构实际迁移时间可能不同</text></svg>