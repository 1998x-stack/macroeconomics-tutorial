<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">共同资产暴露和机构关联的系统风险网络</title><desc id="d">银行A卖出共同抵押品，价格下降影响B估值和C融资，连线代表假定的市场依赖并非实际风险图。</desc><rect width="920" height="490" rx="19" fill="#fffdfa" stroke="#dce5e3"/><rect x="44" y="89" width="270" height="137" rx="13" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="179" y="128" fill="#21363c" font-family="system-ui,sans-serif" text-anchor="middle" font-size="23">金融机构 A</text><text x="179" y="165" fill="#5b6d72" font-family="system-ui,sans-serif" text-anchor="middle" font-size="16">出售共有资产</text><rect x="604" y="89" width="270" height="137" rx="13" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="739" y="128" fill="#21363c" font-family="system-ui,sans-serif" text-anchor="middle" font-size="23">金融机构 B</text><text x="739" y="165" fill="#5b6d72" font-family="system-ui,sans-serif" text-anchor="middle" font-size="16">共同抵押品折价</text><rect x="328" y="319" width="270" height="116" rx="13" fill="#f0eef9" stroke="#7660a6" stroke-width="2"/><text x="463" y="358" fill="#21363c" font-family="system-ui,sans-serif" text-anchor="middle" font-size="23">金融机构 C</text><text x="463" y="395" fill="#5b6d72" font-family="system-ui,sans-serif" text-anchor="middle" font-size="16">短期融资续作</text><path d="M315 160L600 160M720 229L589 318M329 376L183 230" stroke="#98adaa" stroke-width="3" fill="none"/><text x="460" y="65" fill="#21363c" font-family="system-ui,sans-serif" text-anchor="middle" font-size="22">单家决策可能产生共同市场的外部性</text><text x="460" y="468" fill="#5b6d72" font-family="system-ui,sans-serif" text-anchor="middle" font-size="17">连线不意味着现实银行已有违约传染</text></svg>