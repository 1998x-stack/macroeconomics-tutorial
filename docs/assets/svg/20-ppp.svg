<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">PPP使用两地相同可比消费篮子价格</title><desc id="d">国内篮子70元，国外同类篮子10美元，完全无摩擦绝对购买力平价隐含7元每美元。</desc><rect width="920" height="490" rx="20" fill="#fffdfa" stroke="#dce5e3"/><rect x="45" y="95" width="383" height="147" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="236.5" y="138" font-size="23" font-family="system-ui,sans-serif" text-anchor="middle" fill="#21363c">国内同类篮子</text><text x="236.5" y="173" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">P = 70元</text><rect x="492" y="95" width="382" height="147" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="683" y="138" font-size="23" font-family="system-ui,sans-serif" text-anchor="middle" fill="#21363c">国外同类篮子</text><text x="683" y="173" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">P*=10美元</text><text x="460" y="332" font-size="27" font-family="system-ui,sans-serif" text-anchor="middle" fill="#147d80">E_PPP = 70元 / 10美元 = 7元/美元</text><text x="460" y="415" font-size="18" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">跨国质量、运输、税费和非贸易品使现实PPP有偏离</text></svg>