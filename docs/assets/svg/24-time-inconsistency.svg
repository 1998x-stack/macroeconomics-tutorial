<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">时间不一致性与政策承诺的可信度</title><desc id="d">未来政策制定者可能重新优化而偏离今天宣布的计划，公众预见后会提前调整预期。</desc><rect width="920" height="490" rx="20" fill="#fffdf9" stroke="#dce5e3"/><rect x="44" y="96" width="256" height="141" rx="14" fill="#e7f2ef" stroke="#147f80" stroke-width="2"/><text x="172" y="138" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">今天宣布</text><text x="172" y="174" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">低通胀承诺</text><rect x="332" y="96" width="256" height="141" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="460" y="138" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">未来诱因</text><text x="460" y="174" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">短期刺激偏离承诺</text><rect x="620" y="96" width="256" height="141" rx="14" fill="#f1eef9" stroke="#7461ba" stroke-width="2"/><text x="748" y="138" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">公众预期</text><text x="748" y="174" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">提前调整工资与价格</text><path d="M301 165H328M590 165H617" stroke="#147f80" stroke-width="4"/><text x="460" y="332" font-size="21" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">可信承诺、规则和声誉可能缓解时间不一致性</text><text x="460" y="414" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">但规则设计仍需保留应对新冲击的空间</text></svg>