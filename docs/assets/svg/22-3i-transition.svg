<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">中等收入发展策略的1i到3i递进</title><desc id="d">世界银行WDR2024将投资、技术引进扩散和前沿创新作为不同发展阶段需要逐步组合的三类策略。</desc><rect width="920" height="490" rx="20" fill="#fffdf9" stroke="#dce5e3"/><rect x="42" y="111" width="250" height="140" rx="14" fill="#e7f2ef" stroke="#147f80" stroke-width="2"/><text x="167" y="153" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">1i · 投资</text><text x="167" y="189" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">资本与基础设施</text><rect x="335" y="111" width="250" height="140" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="460" y="153" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">2i · 投资 + 引进</text><text x="460" y="189" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">吸收并扩散技术</text><rect x="628" y="111" width="250" height="140" rx="14" fill="#f1eef9" stroke="#7461ba" stroke-width="2"/><text x="753" y="153" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">3i · 投资 + 引进 + 创新</text><text x="753" y="189" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">推动前沿突破</text><text x="460" y="337" font-size="21" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">按发展能力调整组合，而非按收入门槛自动切换</text><text x="460" y="416" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">人才、竞争和治理质量贯穿每一阶段</text></svg>