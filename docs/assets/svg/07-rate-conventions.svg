<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">季度环比与年化增速</title><desc id="desc">本期指数由100变为101，季度增长1%，连续四季复利是假设性年化4.06%。</desc><defs><marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker><marker id="orange" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#cd7355"/></marker></defs><rect width="920" height="480" rx="20" fill="#fffdf9"/><rect x="43" y="90" width="382" height="126" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="234" y="133" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#21363c">单季度增长</text><text x="234" y="167" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#526a70">100 → 101，即 +1%</text><rect x="494" y="90" width="382" height="126" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="685" y="133" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#21363c">复利年化</text><text x="685" y="167" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#526a70">(101/100)⁴ − 1</text><text x="460" y="280" font-family="sans-serif" font-size="26" text-anchor="middle" fill="#21363c">年化 ≈ 4.06% 不是本季实际 +4.06%</text><text x="460" y="347" font-family="sans-serif" font-size="19" text-anchor="middle" fill="#5b6d72">如果下一季度并非继续增长1%，实际全年增速也不同</text></svg>