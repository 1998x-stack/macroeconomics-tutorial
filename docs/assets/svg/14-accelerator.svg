<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">金融加速器的条件性反馈机制</title><desc id="d">盈利现金流下降可能降低净资产、提高融资溢价、压低投资和未来收入，构成有条件的放大循环。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker></defs><rect width="920" height="490" rx="20" fill="#fffdfa"/><rect x="62" y="62" width="354" height="117" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="239" y="103" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" fill="#21363c" text-anchor="middle">现金流恶化</text><text x="239" y="136" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#5b6d72" text-anchor="middle">最初冲击</text><rect x="506" y="62" width="354" height="117" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="683" y="103" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" fill="#21363c" text-anchor="middle">净资产收缩</text><text x="683" y="136" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#5b6d72" text-anchor="middle">抵押品减少</text><rect x="506" y="274" width="354" height="117" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="683" y="315" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" fill="#21363c" text-anchor="middle">融资成本上升</text><text x="683" y="348" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#5b6d72" text-anchor="middle">外部融资溢价扩大</text><rect x="62" y="274" width="354" height="117" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="239" y="315" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" fill="#21363c" text-anchor="middle">投资下降</text><text x="239" y="348" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#5b6d72" text-anchor="middle">未来收入可能更弱</text><path d="M418 123L500 123" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#a)"/><path d="M685 181L685 