<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">RBC与新凯恩斯周期机制的比较</title><desc id="d">RBC强调真实冲击与灵活价格，新凯恩斯模型加入价格工资黏性和名义冲击。</desc><rect width="920" height="490" rx="20" fill="#fffdf9" stroke="#dce5e3"/><rect x="44" y="94" width="390" height="151" rx="14" fill="#e7f2ef" stroke="#147f80" stroke-width="2"/><text x="239" y="136" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">RBC 基准</text><text x="239" y="172" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">真实冲击 · 灵活价格 · 市场出清</text><rect x="486" y="94" width="390" height="151" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="681" y="136" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">新凯恩斯框架</text><text x="681" y="172" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">名义摩擦 · 需求传导 · 政策规则</text><text x="460" y="337" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">两者都可以有微观基础和动态一般均衡</text><text x="460" y="416" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">区别在关键摩擦与冲击假设，而非“理性/非理性”</text></svg>