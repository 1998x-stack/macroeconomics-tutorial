<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="t d"><title id="t">奥肯定律概念性相关图</title><desc id="d">横轴为相对趋势的产出增长，纵轴为失业率变化；下降趋势只说明经验性方向，不是真实回归样本。</desc><defs><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147d80"/></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#cd7355"/></marker></defs><rect width="920" height="510" rx="20" fill="#fffdfa" stroke="#dce5e3"/><path d="M130 75V405H825" stroke="#5b6d72" stroke-width="3" fill="none"/><text x="100" y="70" font-family="sans-serif" font-size="20" fill="#21363c" text-anchor="start">失业变化</text><text x="665" y="462" font-family="sans-serif" font-size="20" fill="#21363c" text-anchor="start">相对趋势产出增长 →</text><path d="M180 127L752 348" stroke="#147d80" stroke-width="5" fill="none" stroke-dasharray="12 8"/><circle cx="204" cy="164" r="9" fill="#cd7355" stroke="#fff" stroke-width="2"/><circle cx="300" cy="187" r="9" fill="#cd7355" stroke="#fff" stroke-width="2"/><circle cx="430" cy="228" r="9" fill="#cd7355" stroke="#fff" stroke-width="2"/><circle cx="562" cy="293" r="9" fill="#cd7355" stroke="#fff" stroke-width="2"/><circle cx="702" cy="320" r="9" fill="#cd7355" stroke="#fff" stroke-width="2"/><text x="480" y="116" font-family="sans-serif" font-size="19" fill="#147d80" text-anchor="middle">典型方向：增长更弱，失业变化可能更高</text><text x="465" y="495" font-family="sans-serif" font-size="16" fill="#5b6d72" text-anchor="middle">示意点非历史数据，斜率需要单独估计</text></svg>