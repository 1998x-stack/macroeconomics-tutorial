<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">资本深化与技术进步的长期区别</title><desc id="d">资本积累沿着生产函数移动，技术进步使生产函数持续上移。</desc><rect width="920" height="490" rx="20" fill="#fffdf9" stroke="#dce5e3"/><rect x="43" y="88" width="385" height="142" rx="14" fill="#e7f2ef" stroke="#147f80" stroke-width="2"/><text x="235.5" y="130" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">资本深化</text><text x="235.5" y="166" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">沿既定生产函数移动</text><rect x="493" y="88" width="385" height="142" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="685.5" y="130" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">技术进步</text><text x="685.5" y="166" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">生产函数整体上移</text><text x="460" y="323" font-size="23" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">资本可以提高稳态人均收入水平</text><text x="460" y="400" font-size="19" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">持续的人均增长需要劳动效率持续改善</text></svg>