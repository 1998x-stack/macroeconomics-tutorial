<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="t d"><title id="t">通胀的需求冲击与供给冲击</title><desc id="d">需求增长可能同时推高价格和产量；不利供给冲击可能推高价格并压低产量，是非定量示意。</desc><defs><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147d80"/></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#cd7355"/></marker></defs><rect width="920" height="510" rx="20" fill="#fffdfa" stroke="#dce5e3"/><rect x="45" y="123" width="390" height="130" rx="14" fill="#e5f3f0" stroke="#147d80" stroke-width="2"/><text x="240" y="168" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">需求扩张</text><text x="240" y="202" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">支出相对产能更强</text><rect x="485" y="123" width="390" height="130" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="680" y="168" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">不利供给冲击</text><text x="680" y="202" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">投入成本或供给瓶颈</text><path d="M240 258 L240 315" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#teal)"/><path d="M680 258 L680 315" fill="none" stroke="#cd7355" stroke-width="3" marker-end="url(#rust)"/><text x="240" y="380" font-family="sans-serif" font-size="25" fill="#147d80" text-anchor="middle">价格 ↑  产出 ↑ / 受限</text><text x="680" y="380" font-family="sans-serif" font-size="25" fill="#cd7355" text-anchor="middle">价格 ↑  产出 ↓</text><text x="460" y="456" font-family="sans-serif" font-size="18" fill="#5b6d72" text-anchor="middle">实际结果取决于政策、预期与资源约束</text></svg>