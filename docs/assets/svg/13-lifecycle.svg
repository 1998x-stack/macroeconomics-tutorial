<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc"><title id="title">生命周期消费和劳动收入的示意</title><desc id="desc">青年劳动收入相对低、工作期较高、退休期降低，而计划消费路径往往更平滑；不是实际调查数据。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker></defs><rect width="920" height="500" rx="18" fill="#fffdf9" stroke="#dce5e3"/><path d="M103 55V406H850" stroke="#567177" stroke-width="3" fill="none"/><polyline points="125,332 246,291 368,155 489,127 611,210 739,358 825,379" stroke="#147d80" stroke-width="5" fill="none"/><polyline points="125,274 246,262 368,236 489,227 611,232 739,247 825,264" stroke="#cd7355" stroke-width="5" fill="none"/><rect x="568" y="71" width="250" height="87" rx="11" fill="white" stroke="#dce5e3"/><text x="584" y="101" font-size="16" font-family="system-ui,'PingFang SC',sans-serif" fill="#147d80" text-anchor="start">— 劳动收入（示意）</text><text x="584" y="134" font-size="16" font-family="system-ui,'PingFang SC',sans-serif" fill="#cd7355" text-anchor="start">— 计划消费（示意）</text><text x="750" y="453" font-size="19" font-family="system-ui,'PingFang SC',sans-serif" fill="#21363c" text-anchor="middle">年龄/生命阶段 →</text></svg>