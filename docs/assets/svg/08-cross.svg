<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">凯恩斯交叉示例</title><desc id="desc">AE=40+0.6Y和45度线AE=Y在Y=100相交；横轴产出，纵轴计划支出。</desc><defs><marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker><marker id="orange" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#cd7355"/></marker></defs><rect width="920" height="480" rx="20" fill="#fffdf9"/><path d="M120 67V392H833" stroke="#566f71" stroke-width="3" fill="none"/><text x="103" y="52" font-family="sans-serif" font-size="21" text-anchor="start" fill="#21363c">AE ↑</text><text x="748" y="428" font-family="sans-serif" font-size="21" text-anchor="start" fill="#21363c">Y →</text><path d="M120 392L740 73" stroke="#63787a" stroke-width="4" fill="none"/><path d="M120 328L740 135" stroke="#147d80" stroke-width="5" fill="none"/><circle cx="430" cy="233" r="8" fill="#cd7355"/><text x="450" y="217" font-family="sans-serif" font-size="20" text-anchor="start" fill="#cd7355">E (100,100)</text><text x="752" y="89" font-family="sans-serif" font-size="19" text-anchor="start" fill="#63787a">AE=Y</text><text x="750" y="150" font-family="sans-serif" font-size="19" text-anchor="start" fill="#147d80">AE=40+0.6Y</text><text x="150" y="306" font-family="sans-serif" font-size="18" text-anchor="start" fill="#147d80">A=40</text></svg>