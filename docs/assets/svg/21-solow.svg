<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">索洛稳态：储蓄投资曲线与收支相抵投资线相交</title><desc id="d">横轴人均资本k，纵轴人均产出与投资。凹的储蓄投资曲线 s·f(k) 与从原点出发的直线 (δ+n+g)k 相交处即稳态 k*；左侧投资大于折旧，k 上升，右侧相反。</desc><rect width="920" height="490" rx="20" fill="#fffdfa" stroke="#dce5e3"/><line x1="120" y1="410" x2="840" y2="410" stroke="#6a7d7d" stroke-width="2"/><line x1="120" y1="410" x2="120" y2="60" stroke="#6a7d7d" stroke-width="2"/><path d="M120 410 Q 340 150 840 96" fill="none" stroke="#147d80" stroke-width="4"/><line x1="120" y1="410" x2="840" y2="250" stroke="#cd7355" stroke-width="4" stroke-dasharray="9 6"/><circle cx="470" cy="205" r="8" fill="#21363c"/><text x="640" y="150" font-size="19" font-family="system-ui,sans-serif" fill="#147d80">s·f(k) 储蓄投资</text><text x="620" y="292" font-size="19" font-family="system-ui,sans-serif" fill="#cd7355">(δ+n+g)k 收支相抵</text><text x="490" y="190" font-size="18" font-family="system-ui,sans-serif" fill="#21363c">稳态 k*</text><text x="480" y="442" font-size="20" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">人均资本 k</text><text x="60" y="240" font-size="18" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72" transform="rotate(-90 60 240)">人均产出 / 投资</text><text x="255" y="372" font-size="16" font-family="system-ui,sans-serif" fill="#5b6d72">此处投资&gt;折旧，k 上升</text><text x="600" y="392" font-size="16" font-family="system-ui,sans-serif" fill="#5b6d72">投资&lt;折旧，k 下降</text></svg>
