<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">实际汇率的本外币价格换算</title><desc id="d">E=7、国外10美元和国内70元时q=1，若仅E升到8而两地篮子价格不变，则q=80/70≈1.143。</desc><rect width="920" height="490" rx="20" fill="#fffdfa" stroke="#dce5e3"/><rect x="44" y="96" width="375" height="137" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="231.5" y="139" font-size="23" font-family="system-ui,sans-serif" text-anchor="middle" fill="#21363c">名义汇率 E</text><text x="231.5" y="174" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">7 → 8，本币贬值</text><rect x="496" y="96" width="377" height="137" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="684.5" y="139" font-size="23" font-family="system-ui,sans-serif" text-anchor="middle" fill="#21363c">两地篮子价</text><text x="684.5" y="174" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">P=70元，P*=10美元</text><text x="460" y="329" font-size="26" font-family="system-ui,sans-serif" text-anchor="middle" fill="#147d80">q = E × P* / P：1.00 → 1.143</text><text x="460" y="419" font-size="18" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">若国内价格也上升，实际竞争力变化可能被抵消</text></svg>