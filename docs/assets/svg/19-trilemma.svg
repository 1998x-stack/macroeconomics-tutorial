<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">开放经济不可能三角的三个政策目标</title><desc id="d">资本高度自由流动、固定汇率和自主货币利率三个目标在经典模型中不能同时完全独立实现。</desc><rect width="920" height="490" rx="20" fill="#fffdfa" stroke="#dce5e3"/><path d="M460 85L153 382H766Z" fill="#f7f8f3" stroke="#147d80" stroke-width="4"/><circle cx="460" cy="85" r="13" fill="#147d80"/><circle cx="153" cy="382" r="13" fill="#cd7355"/><circle cx="766" cy="382" r="13" fill="#7660a6"/><text x="460" y="49" font-size="24" fill="#21363c" text-anchor="middle" font-family="system-ui,sans-serif">汇率稳定</text><text x="125" y="424" font-size="22" fill="#21363c" text-anchor="middle" font-family="system-ui,sans-serif">独立利率政策</text><text x="794" y="424" font-size="22" fill="#21363c" text-anchor="middle" font-family="system-ui,sans-serif">高度资本流动</text><text x="460" y="282" font-size="20" fill="#5b6d72" text-anchor="middle" font-family="system-ui,sans-serif">三项难以同时完全实现</text></svg>