<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">增长核算把产出变化拆成投入贡献与TFP残差</title><desc id="d">在规模报酬不变和竞争性要素定价等假设下，产出增长由资本、劳动加权增长与TFP残差组成。</desc><rect width="920" height="490" rx="20" fill="#fffdf9" stroke="#dce5e3"/><rect x="45" y="88" width="258" height="134" rx="14" fill="#e7f2ef" stroke="#147f80" stroke-width="2"/><text x="174" y="130" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">产出增长 gY</text><text x="174" y="166" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">总量结果</text><rect x="330" y="88" width="258" height="134" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="459" y="130" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">资本与劳动</text><text x="459" y="166" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">αgK + (1−α)gL</text><rect x="615" y="88" width="260" height="134" rx="14" fill="#f1eef9" stroke="#7461ba" stroke-width="2"/><text x="745" y="130" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">TFP 残差</text><text x="745" y="166" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">未解释的加权余项</text><text x="460" y="318" font-size="21" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">TFP 还可能包含投入质量、利用率与测量误差</text><text x="460" y="402" font-size="19" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">不是直接观测到的纯技术变量</text></svg>