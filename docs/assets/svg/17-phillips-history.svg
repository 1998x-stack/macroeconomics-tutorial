<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">早期工资曲线与现代价格通胀曲线</title><desc id="d">早期英国工资增长失业经验关系与加入预期和供给冲击的现代价格通胀关系不是同一统计对象。</desc><rect width="920" height="490" rx="20" fill="#fffdfa" stroke="#dce5e3"/><rect x="42" y="100" width="394" height="151" rx="15" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><rect x="483" y="100" width="394" height="151" rx="15" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="239" y="150" font-family="system-ui,sans-serif" fill="#21363c" font-size="24" text-anchor="middle">早期历史观察</text><text x="239" y="190" font-family="system-ui,sans-serif" fill="#21363c" font-size="19" text-anchor="middle">工资变动 ↔ 失业率</text><text x="680" y="150" font-family="system-ui,sans-serif" fill="#21363c" font-size="24" text-anchor="middle">现代行为模型</text><text x="680" y="190" font-family="system-ui,sans-serif" fill="#21363c" font-size="19" text-anchor="middle">通胀 = 预期 − 缺口 + 冲击</text><text x="460" y="331" font-family="system-ui,sans-serif" fill="#21363c" font-size="23" text-anchor="middle">两个研究对象不可不加说明地混同</text><text x="460" y="402" font-family="system-ui,sans-serif" fill="#5b6d72" font-size="19" text-anchor="middle">时间、制度与结构性冲击改变观察到的统计关系</text></svg>