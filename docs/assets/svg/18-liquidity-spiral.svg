<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">流动性压力导致火售反馈的条件性机制</title><desc id="d">融资收紧引发资产出售，交易价格下跌使抵押折扣增加并导致追加担保，可能反馈到更深的融资压力。</desc><rect width="920" height="490" rx="19" fill="#fffdfa" stroke="#dce5e3"/><rect x="45" y="65" width="372" height="120" rx="13" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="231" y="104" fill="#21363c" font-family="system-ui,sans-serif" text-anchor="middle" font-size="23">短期现金不足</text><text x="231" y="141" fill="#5b6d72" font-family="system-ui,sans-serif" text-anchor="middle" font-size="16">再融资或追加担保</text><rect x="503" y="65" width="372" height="120" rx="13" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="689" y="104" fill="#21363c" font-family="system-ui,sans-serif" text-anchor="middle" font-size="23">被迫出售</text><text x="689" y="141" fill="#5b6d72" font-family="system-ui,sans-serif" text-anchor="middle" font-size="16">市场成交深度有限</text><rect x="503" y="280" width="372" height="120" rx="13" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="689" y="319" fill="#21363c" font-family="system-ui,sans-serif" text-anchor="middle" font-size="23">价格下降</text><text x="689" y="356" fill="#5b6d72" font-family="system-ui,sans-serif" text-anchor="middle" font-size="16">抵押品折扣加深</text><rect x="45" y="280" width="372" height="120" rx="13" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="231" y="319" fill="#21363c" font-family="system-ui,sans-serif" text-anchor="middle" font-size="23">融资约束加强</text><text x="231" y="356" fill="#5b6d72" font-family="system-ui,sans-serif" text-anchor="middle" font-size="16">新一轮追加担保</text><path d="M420 124H500M692 190V278M500 335H420M228 277V188" stroke="#147d80" stroke-width="3" fill="none"/><text x="460" y="460" fill="#5b6d72" font-family="system-ui,sans-serif" text-anchor="middle" font-size="17">流动性工具和足够资本可以打断反馈</text></svg>