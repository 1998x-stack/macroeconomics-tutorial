<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="t d"><title id="t">投资净现值受折现率影响</title><desc id="d">成本100与一年后的110收入，在折现率5%时净现值约4.76，在12%时约-1.79。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker><marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#cd7355"/></marker></defs><rect width="920" height="480" rx="18" fill="#fffdf9"/><rect x="43" y="90" width="370" height="135" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="228" y="130" fill="#21363c" font-family="sans-serif" font-size="24" text-anchor="middle">项目今天</text><text x="228" y="165" fill="#5b6d72" font-family="sans-serif" font-size="17" text-anchor="middle">成本 P = 100</text><rect x="504" y="90" width="370" height="135" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="689" y="130" fill="#21363c" font-family="sans-serif" font-size="24" text-anchor="middle">一年后现金流</text><text x="689" y="165" fill="#5b6d72" font-family="sans-serif" font-size="17" text-anchor="middle">CF = 110</text><path d="M417 158L496 158" stroke="#147d80" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="230" y="307" fill="#147d80" font-family="sans-serif" font-size="23" text-anchor="middle">折现率5% → NPV +4.76</text><text x="700" y="307" fill="#cd7355" font-family="sans-serif" font-size="23" text-anchor="middle">折现率12% → NPV −1.79</text><text x="460" y="410" fill="#5b6d72" font-family="sans-serif" font-size="18" text-anchor="middle">风险、税费、期限等在此构造示例中被暂时忽略</text></svg>