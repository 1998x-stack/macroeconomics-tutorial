<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">逆周期资本缓冲的建立与释放</title><desc id="d">信用风险积累阶段增加缓冲，压力阶段可依据制度释放，防止资本约束加剧贷款收缩。</desc><rect width="920" height="490" rx="19" fill="#fffdfa" stroke="#dce5e3"/><rect x="49" y="103" width="393" height="159" rx="13" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="245.5" y="142" fill="#21363c" font-family="system-ui,sans-serif" text-anchor="middle" font-size="23">上行期：积累缓冲</text><text x="245.5" y="179" fill="#5b6d72" font-family="system-ui,sans-serif" text-anchor="middle" font-size="16">信用及资产价格风险评估</text><rect x="477" y="103" width="393" height="159" rx="13" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="673.5" y="142" fill="#21363c" font-family="system-ui,sans-serif" text-anchor="middle" font-size="23">压力期：释放空间</text><text x="673.5" y="179" fill="#5b6d72" font-family="system-ui,sans-serif" text-anchor="middle" font-size="16">减轻被迫缩减信贷</text><text x="460" y="340" fill="#21363c" font-family="system-ui,sans-serif" text-anchor="middle" font-size="21">政策目标是提高系统韧性，而非精准预知每次泡沫</text><text x="460" y="418" fill="#5b6d72" font-family="system-ui,sans-serif" text-anchor="middle" font-size="18">实际缓冲比例由各司法辖区的监管规则决定</text></svg>