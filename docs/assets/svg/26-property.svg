<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="t d"><title id="t">房地产调整冲击宏观经济的四条传导渠道</title><desc id="d">房地产进入结构性调整后，通过四条渠道拖累经济：开发投资下降直接拖累建筑业；房价下跌产生负财富效应压低消费；土地出让收入下降挤压地方财政与基建；抵押品价值下跌触发金融加速器反向运行。四条渠道相互强化。</desc>
<rect x="0" y="0" width="920" height="470" rx="16" fill="#fffdfa"/>
<text x="40" y="44" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#21363c">一次结构性调整，四条传导渠道</text>
<line x1="40" y1="62" x2="880" y2="62" stroke="#dce5e3" stroke-width="2"/>
<rect x="355" y="190" width="210" height="80" rx="12" fill="#fff7ef" stroke="#cd7355" stroke-width="2"/>
<text x="460" y="226" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle" fill="#8a4a34">房地产调整</text>
<text x="460" y="250" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#5b6d72">结构性转折，非普通周期</text>
<rect x="60" y="96" width="250" height="86" rx="12" fill="#f5faf9" stroke="#147d80" stroke-width="2"/>
<text x="185" y="128" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#21363c">① 投资拖累</text>
<text x="185" y="152" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#5b6d72">开发投资下降</text>
<text x="185" y="172" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#5b6d72">→ 建筑与建材收缩</text>
<rect x="610" y="96" width="250" height="86" rx="12" fill="#f5faf9" stroke="#147d80" stroke-width="2"/>
<text x="735" y="128" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#21363c">② 负财富效应</text>
<text x="735" y="152" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#5b6d72">房价下跌 → 净资产缩水</text>
<text x="735" y="172" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#5b6d72">→ 消费倾向下降</text>
<rect x="60" y="300" width="250" height="86" rx="12" fill="#f5faf9" stroke="#147d80" stroke-width="2"/>
<text x="185" y="332" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#21363c">③ 地方财政收缩</text>
<text x="185" y="356" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#5b6d72">土地出让收入减少</text>
<text x="185" y="376" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#5b6d72">→ 地方基建投资放缓</text>
<rect x="610" y="300" width="250" height="86" rx="12" fill="#f5faf9" stroke="#147d80" stroke-width="2"/>
<text x="735" y="332" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#21363c">④ 金融加速器</text>
<text x="735" y="356" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#5b6d72">抵押品价值下降 → 惜贷</text>
<text x="735" y="376" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#5b6d72">→ 经济收缩 → 再下跌</text>
<line x1="310" y1="150" x2="390" y2="196" stroke="#147d80" stroke-width="2" marker-end="url(#p1)"/>
<line x1="610" y1="150" x2="530" y2="196" stroke="#147d80" stroke-width="2" marker-end="url(#p1)"/>
<line x1="310" y1="330" x2="390" y2="266" stroke="#147d80" stroke-width="2" marker-end="url(#p1)"/>
<line x1="610" y1="330" x2="530" y2="266" stroke="#147d80" stroke-width="2" marker-end="url(#p1)"/>
<text x="460" y="446" font-family="system-ui,sans-serif" font-size="13" font-style="italic" text-anchor="middle" fill="#5b6d72">四条渠道相互强化；“量级估算”需按官方统计口径核对，本章不给出未经校准的具体百分点。</text>
<defs><marker id="p1" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#147d80"/></marker></defs>
</svg>
