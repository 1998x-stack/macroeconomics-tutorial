<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">资产负债表与外部融资溢价的反馈</title><desc id="d">资产价值下跌削弱借款人净资产并提高外部融资溢价，投资和产出下降又进一步削弱资产负债表。</desc><rect width="920" height="490" rx="20" fill="#fffdf9" stroke="#dce5e3"/><rect x="45" y="87" width="260" height="132" rx="14" fill="#e7f2ef" stroke="#147f80" stroke-width="2"/><text x="175" y="129" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">资产价格下降</text><text x="175" y="165" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">抵押品价值下跌</text><rect x="330" y="87" width="260" height="132" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="460" y="129" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">融资溢价上升</text><text x="460" y="165" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">外部资金更昂贵</text><rect x="615" y="87" width="260" height="132" rx="14" fill="#f1eef9" stroke="#7461ba" stroke-width="2"/><text x="745" y="129" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">投资减少</text><text x="745" y="165" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">产出和现金流走弱</text><path d="M306 152H327M591 152H612" stroke="#147f80" stroke-width="4"/><text x="460" y="320" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">企业净资产与融资条件会放大初始冲击</text><text x="460" y="405" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">反馈强度取决于杠杆、抵押品和金融市场结构</text></svg>