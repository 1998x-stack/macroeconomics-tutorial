<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">折现率变化与投资净现值</title><desc id="d">成本100、未来两年每期现金流60，折现率10%为NPV正4.13，折现率20%为负8.33。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker></defs><rect width="920" height="490" rx="20" fill="#fffdfa"/><rect x="44" y="100" width="375" height="135" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="231.5" y="141" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" fill="#21363c" text-anchor="middle">折现率 10%</text><text x="231.5" y="174" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#5b6d72" text-anchor="middle">净现值 +4.13</text><rect x="500" y="100" width="375" height="135" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="687.5" y="141" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" fill="#21363c" text-anchor="middle">折现率 20%</text><text x="687.5" y="174" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#5b6d72" text-anchor="middle">净现值 −8.33</text><text x="460" y="318" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" fill="#21363c" text-anchor="middle">项目两年现金流：60 + 60</text><text x="460" y="410" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#5b6d72" text-anchor="middle">真实项目还要核查税费、风险、维护费用与残值</text></svg>