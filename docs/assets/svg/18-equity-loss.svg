<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">资产损失通过杠杆侵蚀权益</title><desc id="d">起始资产100负债92权益8，资产损失5后资产95权益3。</desc><rect width="920" height="490" rx="19" fill="#fffdfa" stroke="#dce5e3"/><rect x="154" y="91" width="244" height="296" rx="8" fill="#147d80"/><rect x="154" y="358" width="244" height="29" fill="#cd7355"/><rect x="528" y="108" width="244" height="279" rx="8" fill="#cd7355"/><rect x="528" y="376" width="244" height="11" fill="#7660a6"/><text x="276" y="422" fill="#21363c" font-family="system-ui,sans-serif" text-anchor="middle" font-size="18">期初权益 8</text><text x="649" y="422" fill="#21363c" font-family="system-ui,sans-serif" text-anchor="middle" font-size="18">损失后权益 3</text><text x="459" y="466" fill="#5b6d72" font-family="system-ui,sans-serif" text-anchor="middle" font-size="17">蓝/红大部分表示负债，权益底部为对比色；比例仅为示意</text></svg>