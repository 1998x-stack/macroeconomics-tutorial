<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="t d"><title id="t">“降息 + 财政扩张”在 IS-LM 与 AD-AS 中的传导</title><desc id="d">左图 IS-LM：财政扩张使 IS 曲线右移，降息使 LM 曲线右移，均衡产出上升，利率方向取决于两者相对幅度。右图 AD-AS：总需求曲线右移，产出上升、价格小幅上升；短期总供给不变。</desc>
<rect x="0" y="0" width="920" height="470" rx="16" fill="#fffdfa"/>
