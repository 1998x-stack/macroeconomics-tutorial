<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="t d"><title id="t">利率影响投资和计划支出</title><desc id="d">左侧低利率使计划支出更高、45度线交点对应更高的均衡Y；右侧高利率使计划支出降低、均衡Y下降。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker><marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#cd7355"/></marker></defs><rect width="920" height="480" rx="18" fill="#fffdf9"/><path d="M65 95V377H408M513 95V377H858" stroke="#566f71" stroke-width="3" fill="none"/><path d="M65 377L381 110M513 377L836 110" stroke="#7b8c8c" stroke-width="3" fill="none"/><path d="M85 307L380 172" stroke="#147d80" stroke-width="4" fill="none"/><path d="M532 330L834 204" stroke="#cd7355" stroke-width="4" fill="none"/><text x="242" y="61" fill="#147d80" font-family="sans-serif" font-size="21" text-anchor="middle">较低利率 → 投资较高</text><text x="700" y="61" fill="#cd7355" font-family="sans-serif" font-size="21" text-anchor="middle">较高利率 → 投资较低</text><text x="465" y="433" fill="#5b6d72" font-family="sans-serif" font-size="17" text-anchor="middle">交点位置是示意，展示比较静态方向而非统计拟合</text></svg>