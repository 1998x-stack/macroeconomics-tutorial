<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 640" role="img" aria-labelledby="t d"><title id="t">宏观经济中的四个参与者与结果</title><desc id="d">家庭向企业支付消费，企业向家庭支付劳动与资本收入；政府以税收和公共支出参与循环，金融系统提供信用和支付清算。结果由产出、物价、就业和金融指标描述。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker><marker id="rust" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#cd7355"/></marker></defs><rect x="22" y="22" width="886" height="596" rx="24" fill="#fffdfa" stroke="#dce5e3"/><text x="60" y="68" font-family="sans-serif" font-size="17" font-weight="700" fill="#5b6d72">AN ECONOMY IS A SYSTEM OF FEEDBACK</text><rect x="64" y="137" width="310" height="116" rx="16" fill="#e4f2ef" stroke="#147d80" stroke-width="2"/><rect x="556" y="137" width="310" height="116" rx="16" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><rect x="64" y="348" width="310" height="122" rx="16" fill="#f3effb" stroke="#7660a6" stroke-width="2"/><rect x="556" y="348" width="310" height="122" rx="16" fill="#fff7e5" stroke="#a18243" stroke-width="2"/><g font-family="sans-serif" text-anchor="middle" fill="#21363c" font-weight="700" font-size="29"><text x="219" y="187">家庭</text><text x="711" y="187">企业</text><text x="219" y="398">政府</text><text x="711" y="398">金融体系</text></g><g font-family="sans-serif" text-anchor="middle" fill="#5b6d72" font-size="16"><text x="219" y="217">消费 · 工作 · 储蓄</text><text x="711" y="217">生产 · 雇佣 · 投资</text><text x="219" y="429">税收 · 公共服务</text><text x="711" y="429">信用 · 利率 · 清算</text></g><path d="M374 165H553" stroke="#147d80" stroke-width="3" marker-end="url(#arrow)"/><path d="M556 225H377" stroke="#cd7355" stroke-width="3" marker-end="url(#rust)"/><g font-family="sans-serif" font-size="15" text-anchor="middle"><text x="466" y="154" fill="#147d80">商品与服务支出</text><text x="466" y="247" fill="#cd7355">劳动与资本收入</text></g><path d="M219 255V347M711 255V347" stroke="#839493" st