<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc"><title id="title">IS 与 LM 的两条均衡约束</title><desc id="desc">商品市场自下而上的计划支出反馈与货币市场持币机会成本在 Y、i 上交汇。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker></defs><rect width="920" height="500" rx="18" fill="#fffdf9" stroke="#dce5e3"/><rect x="55" y="100" width="345" height="112" rx="14" stroke="#147d80" stroke-width="2" fill="#e4f2ed"/><text x="227.5" y="139" font-size="23" font-family="system-ui,'PingFang SC',sans-serif" fill="#21363c" text-anchor="middle">商品市场 / IS</text><text x="227.5" y="173" font-size="16" font-family="system-ui,'PingFang SC',sans-serif" fill="#5b6d72" text-anchor="middle">0.4Y+4i=220</text><rect x="523" y="100" width="345" height="112" rx="14" stroke="#cd7355" stroke-width="2" fill="#fff0e9"/><text x="695.5" y="139" font-size="23" font-family="system-ui,'PingFang SC',sans-serif" fill="#21363c" text-anchor="middle">货币市场 / LM</text><text x="695.5" y="173" font-size="16" font-family="system-ui,'PingFang SC',sans-serif" fill="#5b6d72" text-anchor="middle">0.5Y−10i=200</text><path d="M230 214L410 290" stroke="#147d80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M692 214L510 290" stroke="#147d80" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="352" y="291" width="220" height="96" rx="15" fill="#edf1fb" stroke="#7660a6" stroke-width="2"/><text x="460" y="332" font-size="24" font-family="system-ui,'PingFang SC',sans-serif" fill="#21363c" text-anchor="middle">共同交点</text><text x="460" y="361" font-size="20" font-family="system-ui,'PingFang SC',sans-serif" fill="#7660a6" text-anchor="middle">(Y*, i*)</text><text x="460" y="442" font-size="18" font-family="system-ui,'PingFang SC',sans-serif" fill="#5b6d72" text-anchor="middle">两条方程都成立才是联立均衡</text></svg>