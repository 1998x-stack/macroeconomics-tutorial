<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="t d"><title id="t">条件趋同：初始收入越低，向自身稳态的追赶增长越快</title><desc id="d">横轴为相对于自身稳态的初始人均资本，纵轴为人均资本增长率。曲线向下倾斜，在自身稳态 k* 处增长率为技术增长 g；低于自身稳态的经济体增长更快，但这只在对储蓄率、人口、制度等条件可比时成立。</desc><rect width="920" height="470" rx="20" fill="#fffdfa" stroke="#dce5e3"/><line x1="120" y1="380" x2="850" y2="380" stroke="#6a7d7d" stroke-width="2"/><line x1="120" y1="380" x2="120" y2="70" stroke="#6a7d7d" stroke-width="2"/><line x1="120" y1="210" x2="850" y2="210" stroke="#a18243" stroke-width="2" stroke-dasharray="8 6"/><path d="M150 96 L 840 344" fill="none" stroke="#147d80" stroke-width="4"/><circle cx="235" cy="132" r="9" fill="#147d80"/><circle cx="420" cy="203" r="9" fill="#147d80"/><circle cx="605" cy="274" r="9" fill="#cd7355"/><circle cx="790" cy="344" r="9" fill="#cd7355"/><text x="470" y="200" font-size="17" font-family="system-ui,sans-serif" fill="#a18243">自身稳态处增长率 = 技术进步率 g</text><text x="600" y="330" font-size="18" font-family="system-ui,sans-serif" fill="#21363c">k* 稳态</text><text x="140" y="112" font-size="17" font-family="system-ui,sans-serif" fill="#147d80">起点低于自身稳态：快速增长</text><text x="480" y="410" font-size="19" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">相对于自身稳态的初始人均资本</text><text x="58" y="230" font-size="17" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72" transform="rotate(-90 58 230)">人均资本增长率</text><text x="460" y="445" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">条件趋同预测，非各国无条件自动收敛</text></svg>
