<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">政策规则改变后历史行为参数可能改变</title><desc id="d">家庭和企业会预期政策变化并调整决策，旧制度下估计的约化关系未必能直接用于新制度。</desc><rect width="920" height="490" rx="20" fill="#fffdf9" stroke="#dce5e3"/><rect x="45" y="88" width="260" height="138" rx="14" fill="#e7f2ef" stroke="#147f80" stroke-width="2"/><text x="175" y="130" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">旧政策制度</text><text x="175" y="166" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">历史数据与回归系数</text><rect x="330" y="88" width="260" height="138" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="460" y="130" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">政策规则改变</text><text x="460" y="166" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">预期与最优选择更新</text><rect x="615" y="88" width="260" height="138" rx="14" fill="#f1eef9" stroke="#7461ba" stroke-width="2"/><text x="745" y="130" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">新制度关系</text><text x="745" y="166" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">参数与行为路径可能改变</text><path d="M307 157H327M592 157H612" stroke="#147f80" stroke-width="4"/><text x="460" y="320" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">不能把历史相关系数当作政策不变常数</text><text x="460" y="407" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">结构模型也需要检验、识别和稳健性分析</text></svg>