<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc"><title id="title">借贷约束导致消费难以平滑</title><desc id="desc">第一期收入80、未来收入120、总资源200，无约束可两期各消费100；无法借贷只能在第一期消费80。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker></defs><rect width="920" height="500" rx="18" fill="#fffdf9" stroke="#dce5e3"/><rect x="45" y="95" width="390" height="132" rx="14" stroke="#147d80" stroke-width="2" fill="#e4f2ed"/><text x="240" y="134" font-size="23" font-family="system-ui,'PingFang SC',sans-serif" fill="#21363c" text-anchor="middle">可自由借20</text><text x="240" y="168" font-size="16" font-family="system-ui,'PingFang SC',sans-serif" fill="#5b6d72" text-anchor="middle">第一期 100 / 第二期 100</text><rect x="481" y="95" width="390" height="132" rx="14" stroke="#cd7355" stroke-width="2" fill="#fff0e9"/><text x="676" y="134" font-size="23" font-family="system-ui,'PingFang SC',sans-serif" fill="#21363c" text-anchor="middle">不能借款</text><text x="676" y="168" font-size="16" font-family="system-ui,'PingFang SC',sans-serif" fill="#5b6d72" text-anchor="middle">第一期 80 / 第二期 120</text><text x="244" y="313" font-size="22" font-family="system-ui,'PingFang SC',sans-serif" fill="#147d80" text-anchor="middle">更接近消费平滑</text><text x="667" y="313" font-size="22" font-family="system-ui,'PingFang SC',sans-serif" fill="#cd7355" text-anchor="middle">今天现金流约束</text><text x="460" y="416" font-size="18" font-family="system-ui,'PingFang SC',sans-serif" fill="#5b6d72" text-anchor="middle">现实限制包括抵押、利率、信用评分和收入风险</text></svg>