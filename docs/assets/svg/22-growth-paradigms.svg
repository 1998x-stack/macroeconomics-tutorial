<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">三种增长理论关注的机制不同</title><desc id="d">索洛强调资本深化和外生技术；AK强调广义资本不递减回报；创意模型强调研发创造非竞争知识。</desc><rect width="920" height="490" rx="20" fill="#fffdf9" stroke="#dce5e3"/><rect x="35" y="85" width="267" height="149" rx="14" fill="#e7f2ef" stroke="#147f80" stroke-width="2"/><text x="168.5" y="127" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">索洛模型</text><text x="168.5" y="163" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">资本递减回报 + 外生技术</text><rect x="327" y="85" width="267" height="149" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="460.5" y="127" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">AK 模型</text><text x="460.5" y="163" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">广义资本不递减回报</text><rect x="619" y="85" width="267" height="149" rx="14" fill="#f1eef9" stroke="#7461ba" stroke-width="2"/><text x="752.5" y="127" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">创意生产</text><text x="752.5" y="163" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">研发创造非竞争知识</text><text x="460" y="330" font-size="21" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">它们是不同假设下的模型，不是同一个理论的三个名字</text><text x="460" y="411" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">模型解释机制，不自动给出唯一政策配方</text></svg>