<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">新增收入分配与乘数漏出</title><desc id="desc">税收、进口与储蓄是简单模型中阻止一笔收入完全转为本国下一轮支出的漏出渠道。</desc><defs><marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker><marker id="orange" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#cd7355"/></marker></defs><rect width="920" height="480" rx="20" fill="#fffdf9"/><rect x="315" y="53" width="290" height="105" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="460" y="96" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#21363c">新增收入 +1</text><text x="460" y="130" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#526a70">分配去向</text><path d="M460 160L460 210" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="257" width="190" height="108" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="131" y="300" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#21363c">税收</text><text x="131" y="334" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#526a70">比例税 t</text><rect x="249" y="257" width="190" height="108" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="344" y="300" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#21363c">进口</text><text x="344" y="334" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#526a70">m × 新增收入</text><rect x="461" y="257" width="190" height="108" rx="14" fill="#f2eefb" stroke="#7660a6" stroke-width="2"/><text x="556" y="300" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#21363c">储蓄</text><text x="556" y="334" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#526a70">未消费部分</text><rect x="674" y="257" width="206" height="108" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="777" y="300" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#21363c">国内消费</text><text x="777" y="334" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#526a70">下一轮需求</text><text x="460" y="423" font-family="sans-serif" font-size="20" text-anchor="middle" fill="#5b6d72">漏出越大，其他条件不变时的简单乘数越小</text></svg>