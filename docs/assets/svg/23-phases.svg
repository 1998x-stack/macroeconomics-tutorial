<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="t d"><title id="t">经济周期的四个阶段：扩张、顶峰、衰退、谷底</title><desc id="d">横轴为时间，纵轴为实际产出。实线围绕虚线的长期增长趋势上下波动，依次标注扩张、顶峰、衰退与谷底；一次周期的长度与振幅并不可预测，趋势线本身也在移动。</desc>
<rect x="0" y="0" width="920" height="470" rx="16" fill="#fffdfa"/>
<text x="40" y="44" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#21363c">围绕长期趋势的上下波动</text>
<line x1="80" y1="400" x2="870" y2="400" stroke="#6a7d7d" stroke-width="2"/>
<line x1="80" y1="400" x2="80" y2="70" stroke="#6a7d7d" stroke-width="2"/>
<text x="860" y="424" font-family="system-ui,sans-serif" font-size="15" text-anchor="end" fill="#5b6d72">时间 →</text>
<text x="70" y="82" font-family="system-ui,sans-serif" font-size="15" fill="#5b6d72">实际产出</text>
<line x1="80" y1="300" x2="870" y2="220" stroke="#a18243" stroke-width="2" stroke-dasharray="7 6"/>
<text x="632" y="252" font-family="system-ui,sans-serif" font-size="14" fill="#a18243">长期趋势</text>
<path d="M80 305 C 150 250, 190 130, 250 150 C 320 175, 350 300, 420 330 C 490 356, 520 250, 580 200 C 640 152, 700 120, 770 150 C 820 172, 845 210, 870 200" fill="none" stroke="#147d80" stroke-width="3"/>
<circle cx="250" cy="150" r="6" fill="#cd7355"/><text x="250" y="130" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#a06a58">顶峰</text>
<circle cx="420" cy="330" r="6" fill="#7660a6"/><text x="420" y="356" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#7660a6">谷底</text>
<text x="160" y="230" font-family="system-ui,sans-serif" font-size="15" fill="#147d80">扩张</text>
<text x="335" y="300" font-family="system-ui,sans-serif" font-size="15" fill="#147d80">衰退</text>
<text x="500" y="230" font-family="system-ui,sans-serif" font-size="15" fill="#147d80">扩张</text>
<text x="680" y="230" font-family="system-ui,sans-serif" font-size="15" fill="#147d80">扩张</text>
<text x="190" y="300" font-family="system-ui,sans-serif" font-size="13" fill="#5b6d72">就业增、利润升</text>
<text x="300" y="382" font-family="system-ui,sans-serif" font-size="13" fill="#5b6d72">失业升、消费弱</text>
</svg>
