<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="t d"><title id="t">家庭与企业的宏观循环流</title><desc id="d">家庭购买商品并向企业支付支出，企业向家庭支付要素报酬；下方政府和金融体系影响收支循环。</desc><defs><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147d80"/></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#cd7355"/></marker></defs><rect width="920" height="510" rx="20" fill="#fffdfa" stroke="#dce5e3"/><rect x="60" y="108" width="324" height="118" rx="14" fill="#e5f3f0" stroke="#147d80" stroke-width="2"/><text x="222" y="153" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">家庭</text><text x="222" y="187" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">消费、劳动与储蓄</text><rect x="540" y="108" width="324" height="118" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="702" y="153" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">企业</text><text x="702" y="187" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">生产、雇佣与投资</text><path d="M384 142 L538 142" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#teal)"/><text x="460" y="130" font-family="sans-serif" font-size="16" fill="#147d80" text-anchor="middle">购买支出</text><path d="M540 211 L386 211" fill="none" stroke="#cd7355" stroke-width="3" marker-end="url(#rust)"/><text x="460" y="246" font-family="sans-serif" font-size="16" fill="#cd7355" text-anchor="middle">工资与资本收入</text><rect x="60" y="322" width="324" height="118" rx="14" fill="#f2eefb" stroke="#7660a6" stroke-width="2"/><text x="222" y="367" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">政府</text><text x="222" y="401" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">税收与公共购买</text><rect x="540" y="322" width="324" height="118" rx="14" fill="#fff5e9" stroke="#a18243" stroke-width="2"/><text x="702" y="367" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">金融体系</text><text x="702" y="401" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">存款、信用与清算</text><path d="M226 229 L226 318" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#teal)"/><path d="M702 229 L702 318" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#teal)"/><text x="465" y="478" font-family="sans-serif" font-size="18" fill="#5b6d72" text-anchor="middle">账户关系 ≠ 某一政策的必然因果效果</text></svg>