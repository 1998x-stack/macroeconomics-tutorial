<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">可复核宏观研究的五个步骤</title><desc id="desc">官方发布、保留数据版本和时间戳、确认单位口径、适当变换、交叉验证，最后输出有限条件的解释。</desc><defs><marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker><marker id="orange" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#cd7355"/></marker></defs><rect width="920" height="480" rx="20" fill="#fffdf9"/><rect x="24" y="146" width="156" height="96" rx="13" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="102" y="201" font-family="sans-serif" font-size="21" text-anchor="middle" fill="#21363c">官方发布</text><path d="M181 190L204 190" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#arrow)"/><rect x="206" y="146" width="156" height="96" rx="13" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="284" y="201" font-family="sans-serif" font-size="21" text-anchor="middle" fill="#21363c">日期与版本</text><path d="M363 190L386 190" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#arrow)"/><rect x="388" y="146" width="156" height="96" rx="13" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="466" y="201" font-family="sans-serif" font-size="21" text-anchor="middle" fill="#21363c">单位及定义</text><path d="M545 190L568 190" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#arrow)"/><rect x="570" y="146" width="156" height="96" rx="13" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="648" y="201" font-family="sans-serif" font-size="21" text-anchor="middle" fill="#21363c">数学变换</text><path d="M727 190L750 190" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#arrow)"/><rect x="752" y="146" width="156" height="96" rx="13" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="830" y="201" font-family="sans-serif" font-size="21" text-anchor="middle" fill="#21363c">交叉验证</text><text x="460" y="339" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#21363c">保存可重复计算的输入与转换脚本</text><text x="460" y="392" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#5b6d72">相关变化不是因果识别；仍需考察替代解释</text></svg>