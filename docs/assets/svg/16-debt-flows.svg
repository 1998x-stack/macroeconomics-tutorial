<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">政府债务预算约束的分子分母</title><desc id="d">期初债务加利息减基本盈余为期末债务，再除以当期名义GDP得债务率。</desc><rect width="920" height="490" rx="18" fill="#fffdfa" stroke="#dce5e3"/><rect x="36" y="86" width="268" height="132" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="170" y="128" font-size="23" text-anchor="middle" font-family="system-ui,sans-serif" fill="#21363c">债务存量</text><text x="170" y="163" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#5b6d72">期初 B</text><rect x="326" y="86" width="268" height="132" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="460" y="128" font-size="23" text-anchor="middle" font-family="system-ui,sans-serif" fill="#21363c">有效利息</text><text x="460" y="163" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#5b6d72">i × 期初 B</text><rect x="616" y="86" width="268" height="132" rx="14" fill="#f1eef9" stroke="#7660a6" stroke-width="2"/><text x="750" y="128" font-size="23" text-anchor="middle" font-family="system-ui,sans-serif" fill="#21363c">基本盈余</text><text x="750" y="163" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#5b6d72">PB = 税收−非利息支出</text><rect x="275" y="326" width="370" height="118" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="460" y="368" font-size="23" text-anchor="middle" font-family="system-ui,sans-serif" fill="#21363c">债务率</text><text x="460" y="403" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#5b6d72">期末债务 / 当期名义GDP</text><text x="461" y="277" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#21363c">名义 GDP 增长改变比率的分母</text></svg>