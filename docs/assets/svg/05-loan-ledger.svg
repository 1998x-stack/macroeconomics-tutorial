<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="t d"><title id="t">商业银行放贷一瞬间的资产负债表</title><desc id="d">发放贷款100后，资产端新增贷款100，负债端新增存款100，银行资本不因这次交易自动增加。</desc><defs><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147d80"/></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#cd7355"/></marker></defs><rect width="920" height="510" rx="20" fill="#fffdfa" stroke="#dce5e3"/><rect x="60" y="98" width="380" height="130" rx="14" fill="#e5f3f0" stroke="#147d80" stroke-width="2"/><text x="250" y="143" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">资产 Assets</text><text x="250" y="177" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">贷款 +100</text><rect x="480" y="98" width="380" height="130" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="670" y="143" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">负债 Liabilities</text><text x="670" y="177" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">客户存款 +100</text><text x="460" y="295" font-family="sans-serif" font-size="27" fill="#21363c" text-anchor="middle">资产增加 = 负债增加</text><text x="460" y="345" font-family="sans-serif" font-size="22" fill="#147d80" text-anchor="middle">+100                    +100</text><text x="460" y="419" font-family="sans-serif" font-size="18" fill="#5b6d72" text-anchor="middle">权益资本并没有因记账本身自动增加</text></svg>