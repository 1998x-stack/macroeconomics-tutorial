<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="t d"><title id="t">AI 投资潮的宏观渠道与估值取舍</title><desc id="d">AI 投资通过三个渠道影响宏观：数据中心与算力投资直接拉动需求；技术提升生产率与全要素生产率；同时抬升电力需求。另一面是估值泡沫风险，以及泡沫破裂后可能留下“技术遗产”但不免资源错配与就业损失的权衡。</desc>
<rect x="0" y="0" width="920" height="470" rx="16" fill="#fffdfa"/>
<text x="40" y="44" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#21363c">技术投资潮：拉动与风险并存</text>
<line x1="40" y1="62" x2="880" y2="62" stroke="#dce5e3" stroke-width="2"/>
<rect x="360" y="86" width="200" height="60" rx="12" fill="#e1f2ef" stroke="#147d80" stroke-width="2"/>
<text x="460" y="122" font-family="system-ui,sans-serif" font-size="17" text-anchor="middle" fill="#145e60">AI 投资潮</text>
<line x1="400" y1="146" x2="200" y2="196" stroke="#147d80" stroke-width="2" marker-end="url(#a2)"/>
<line x1="460" y1="146" x2="460" y2="196" stroke="#147d80" stroke-width="2" marker-end="url(#a2)"/>
<line x1="520" y1="146" x2="720" y2="196" stroke="#147d80" stroke-width="2" marker-end="url(#a2)"/>
<rect x="70" y="200" width="260" height="96" rx="12" fill="#f5faf9" stroke="#147d80" stroke-width="2"/>
<text x="200" y="232" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#21363c">直接需求</text>
<text x="200" y="258" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#5b6d72">数据中心、服务器、芯片</text>
<text x="200" y="278" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#5b6d72">→ 投资 I 上升</text>
<rect x="330" y="200" width="260" height="96" rx="12" fill="#f5faf9" stroke="#147d80" stroke-width="2"/>
<text x="460" y="232" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#21363c">生产率</text>
<text x="460" y="258" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#5b6d72">提升研发、编码、服务效率</text>
<text x="460" y="278" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#5b6d72">→ 中期 TFP 提升</text>
<rect x="590" y="200" width="260" height="96" rx="12" fill="#fbf7e9" stroke="#a18243" stroke-width="2"/>
<text x="720" y="232" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#7a6229">电力与基础设施</text>
<text x="720" y="258" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#5b6d72">大型数据中心耗电高</text>
<text x="720" y="278" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#5b6d72">→ 电力需求上升</text>
<rect x="150" y="330" width="620" height="96" rx="12" fill="#fff7ef" stroke="#cd7355" stroke-width="2"/>
<text x="460" y="360" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle" fill="#8a4a34">另一面：估值泡沫风险与“技术遗产”的取舍</text>
<text x="460" y="386" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#5b6d72">高估值透支未来增长；若商业化不及预期，破裂会冲击金融与实体。</text>
<text x="460" y="410" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#5b6d72">但超量建设的算力与网络，也可能成为未来生产率的“基础设施红利”。</text>
<defs><marker id="a2" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#147d80"/></marker></defs>
</svg>
