<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="t d"><title id="t">宏观分析的三个时间尺度</title><desc id="d">短期产出和需求，中期价格和工资预期，长期技术资本和人口；具体时长取决于模型。</desc><defs><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147d80"/></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#cd7355"/></marker></defs><rect width="920" height="510" rx="20" fill="#fffdfa" stroke="#dce5e3"/><rect x="34" y="112" width="269" height="153" rx="14" fill="#e5f3f0" stroke="#147d80" stroke-width="2"/><text x="168.5" y="157" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">短期</text><text x="168.5" y="191" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">需求 · 产能利用</text><rect x="326" y="112" width="269" height="153" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="460.5" y="157" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">中期</text><text x="460.5" y="191" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">工资 · 价格 · 预期</text><rect x="618" y="112" width="269" height="153" rx="14" fill="#f2eefb" stroke="#7660a6" stroke-width="2"/><text x="752.5" y="157" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">长期</text><text x="752.5" y="191" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">资本 · 劳动 · 技术</text><path d="M304 185 L322 185" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#teal)"/><path d="M596 185 L614 185" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#teal)"/><text x="169" y="333" font-family="sans-serif" font-size="18" fill="#21363c" text-anchor="middle">产出数量可快速变化</text><text x="462" y="333" font-family="sans-serif" font-size="18" fill="#21363c" text-anchor="middle">价格和预期逐渐调整</text><text x="753" y="333" font-family="sans-serif" font-size="18" fill="#21363c" text-anchor="middle">潜在供给能力变化</text><text x="460" y="430" font-family="sans-serif" font-size="18" fill="#5b6d72" text-anchor="middle">时间尺度代表模型中的调整机制，而非固定年数</text></svg>