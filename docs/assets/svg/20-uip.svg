<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">国内高利率与隐含的预期汇率变化</title><desc id="d">国内利率5%、国外2%、E0=7，若无风险溢价UIP严格成立则预期E1约7.21，本币预期贬值而非保证发生。</desc><rect width="920" height="490" rx="20" fill="#fffdfa" stroke="#dce5e3"/><rect x="48" y="94" width="384" height="141" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="240" y="137" font-size="23" font-family="system-ui,sans-serif" text-anchor="middle" fill="#21363c">国内名义利率</text><text x="240" y="172" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">5%</text><rect x="493" y="94" width="383" height="141" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="684.5" y="137" font-size="23" font-family="system-ui,sans-serif" text-anchor="middle" fill="#21363c">国外名义利率</text><text x="684.5" y="172" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">2%</text><text x="461" y="325" font-size="28" font-family="system-ui,sans-serif" text-anchor="middle" fill="#147d80">E₁ᵉ = 7 × 1.05/1.02 ≈ 7.21</text><text x="460" y="415" font-size="18" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">预期值与未来实现值不同；风险溢价可使UIP偏离</text></svg>