<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">DSGE模型的主要组成部分</title><desc id="d">家庭、企业、政策制定者、冲击过程和市场清算条件在动态一般均衡中共同决定内生变量。</desc><rect width="920" height="490" rx="20" fill="#fffdf9" stroke="#dce5e3"/><rect x="43" y="82" width="255" height="131" rx="14" fill="#e7f2ef" stroke="#147f80" stroke-width="2"/><text x="170.5" y="124" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">家庭</text><text x="170.5" y="160" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">消费、劳动、储蓄</text><rect x="333" y="82" width="255" height="131" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="460.5" y="124" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">企业</text><text x="460.5" y="160" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">生产、投资、定价</text><rect x="623" y="82" width="255" height="131" rx="14" fill="#f1eef9" stroke="#7461ba" stroke-width="2"/><text x="750.5" y="124" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">政策制定者</text><text x="750.5" y="160" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">利率规则与政策冲击</text><rect x="180" y="306" width="255" height="113" rx="14" fill="#e7f2ef" stroke="#147f80" stroke-width="2"/><text x="307.5" y="348" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">随机冲击</text><text x="307.5" y="384" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">技术、偏好、成本</text><rect x="484" y="306" width="255" height="113" rx="14" fill="#e7f2ef" stroke="#147f80" stroke-width="2"/><text x="611.5" y="348" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">市场清算</text><text x="611.5" y="384" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">资源与资