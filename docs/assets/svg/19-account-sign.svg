<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">经常账户资本账户和金融账户的符号对应</title><desc id="d">净出口-10、初次净收入+4、二次净收入-1时CA=-7，资本账户+2时净借款-5。</desc><rect width="920" height="490" rx="20" fill="#fffdfa" stroke="#dce5e3"/><rect x="35" y="92" width="272" height="135" rx="13" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="171" y="133" font-size="23" fill="#21363c" text-anchor="middle" font-family="system-ui,sans-serif">经常账户</text><text x="171" y="169" font-size="16" fill="#5b6d72" text-anchor="middle" font-family="system-ui,sans-serif">−10 + 4 −1 = −7</text><rect x="325" y="92" width="272" height="135" rx="13" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="461" y="133" font-size="23" fill="#21363c" text-anchor="middle" font-family="system-ui,sans-serif">资本账户</text><text x="461" y="169" font-size="16" fill="#5b6d72" text-anchor="middle" font-family="system-ui,sans-serif">+2</text><rect x="615" y="92" width="272" height="135" rx="13" fill="#f1eef9" stroke="#7660a6" stroke-width="2"/><text x="751" y="133" font-size="23" fill="#21363c" text-anchor="middle" font-family="system-ui,sans-serif">合计净借贷</text><text x="751" y="169" font-size="16" fill="#5b6d72" text-anchor="middle" font-family="system-ui,sans-serif">−7 + 2 = −5</text><text x="460" y="319" font-size="22" fill="#21363c" text-anchor="middle" font-family="system-ui,sans-serif">金融账户 资产净取得3 − 负债净发生8 = −5</text><text x="460" y="406" font-size="18" fill="#5b6d72" text-anchor="middle" font-family="system-ui,sans-serif">负值表示本经济体对外净借款，不是全部交易净额都记正</text></svg>