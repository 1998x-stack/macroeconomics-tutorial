<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">真实经济周期的真实冲击与跨期调整</title><desc id="d">技术冲击改变生产率和要素回报，家庭与企业调整劳动、消费、资本投资；投资建造时间带来动态传播。</desc><rect width="920" height="490" rx="20" fill="#fffdf9" stroke="#dce5e3"/><rect x="43" y="89" width="253" height="133" rx="14" fill="#e7f2ef" stroke="#147f80" stroke-width="2"/><text x="169.5" y="131" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">生产率冲击</text><text x="169.5" y="167" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">技术或真实供给</text><rect x="333" y="89" width="253" height="133" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="459.5" y="131" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">最优决策</text><text x="459.5" y="167" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">劳动、消费、投资</text><rect x="623" y="89" width="253" height="133" rx="14" fill="#f1eef9" stroke="#7461ba" stroke-width="2"/><text x="749.5" y="131" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">产出与就业</text><text x="749.5" y="167" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">均衡动态路径</text><path d="M298 155H329M588 155H619" stroke="#147f80" stroke-width="4"/><text x="460" y="319" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">真实冲击通过要素回报和跨期选择传播</text><text x="460" y="408" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">价格灵活是基准假设，不是所有市场的经验事实</text></svg>