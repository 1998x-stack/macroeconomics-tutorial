<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="t d"><title id="t">国家间人均收入数量级的构造示例</title><desc id="d">以购买力平价人均GDP的数量级做示意：富裕经济体远高于低收入经济体，差距可达数十倍。柱高为构造示例，不是某一年份的精确统计。</desc><rect width="920" height="470" rx="20" fill="#fffdfa" stroke="#dce5e3"/><line x1="70" y1="380" x2="860" y2="380" stroke="#6a7d7d" stroke-width="2"/><rect x="95" y="107" width="100" height="273" rx="6" fill="#147d80"/><rect x="250" y="216" width="100" height="164" rx="6" fill="#7660a6"/><rect x="405" y="330" width="100" height="50" rx="6" fill="#a18243"/><rect x="560" y="361" width="100" height="19" rx="6" fill="#cd7355"/><rect x="715" y="378" width="100" height="2" rx="1" fill="#5b6d72"/><text x="145" y="92" font-size="17" font-family="system-ui,sans-serif" text-anchor="middle" fill="#21363c">约127</text><text x="300" y="201" font-size="17" font-family="system-ui,sans-serif" text-anchor="middle" fill="#21363c">约76</text><text x="455" y="315" font-size="17" font-family="system-ui,sans-serif" text-anchor="middle" fill="#21363c">约23</text><text x="610" y="346" font-size="17" font-family="system-ui,sans-serif" text-anchor="middle" fill="#21363c">约9</text><text x="765" y="363" font-size="17" font-family="system-ui,sans-serif" text-anchor="middle" fill="#21363c">约0.8</text><text x="145" y="408" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">富裕经济体</text><text x="300" y="408" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">高收入</text><text x="455" y="408" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">上中等</text><text x="610" y="408" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">下中等</text><text x="765" y="408" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">低收入</text><text x="460" y="443" font-size="16" font-family="system-ui,sans-serif" text-anchor="middle" fill="#5b6d72">纵轴：PPP 人均 GDP 数量级（千美元，构造示例）</text></svg>
