<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">名义回报与购买力</title><desc id="desc">名义本金100变105，但价格指数100变103，实际购买力约增加1.94%。</desc><defs><marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker><marker id="orange" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#cd7355"/></marker></defs><rect width="920" height="480" rx="20" fill="#fffdf9"/><rect x="48" y="92" width="378" height="130" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="237" y="135" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#21363c">名义账户</text><text x="237" y="169" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#526a70">本金 100 → 105</text><rect x="494" y="92" width="378" height="130" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="683" y="135" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#21363c">消费篮子</text><text x="683" y="169" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#526a70">价格指数 100 → 103</text><text x="460" y="278" font-family="sans-serif" font-size="27" text-anchor="middle" fill="#21363c">购买力倍数 = 105 ÷ 103</text><rect x="145" y="315" width="630" height="95" rx="17" fill="#e7f3ee"/><text x="460" y="355" font-family="sans-serif" font-size="30" text-anchor="middle" fill="#147d80">事后实际回报 ≈ +1.94%</text><text x="460" y="384" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#21363c">而不是名义的 +5.00%</text></svg>