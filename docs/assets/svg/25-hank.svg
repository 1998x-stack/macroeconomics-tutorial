<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">异质家庭的直接与间接政策传导</title><desc id="d">HANK模型通过家庭收入和财富分布，刻画利率、就业、工资、资产价格与转移支付的分配效应。</desc><rect width="920" height="490" rx="20" fill="#fffdf9" stroke="#dce5e3"/><rect x="40" y="91" width="255" height="139" rx="14" fill="#e7f2ef" stroke="#147f80" stroke-width="2"/><text x="167.5" y="133" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">家庭分布</text><text x="167.5" y="169" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">财富、收入、流动性</text><rect x="333" y="91" width="255" height="139" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="460.5" y="133" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">政策冲击</text><text x="460.5" y="169" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">利率与财政工具</text><rect x="625" y="91" width="255" height="139" rx="14" fill="#f1eef9" stroke="#7461ba" stroke-width="2"/><text x="752.5" y="133" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">异质响应</text><text x="752.5" y="169" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">消费、就业、福利</text><path d="M298 160H330M590 160H622" stroke="#147f80" stroke-width="4"/><text x="460" y="321" font-size="21" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">直接渠道：跨期替代与资产重估</text><text x="460" y="390" font-size="19" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">间接渠道：工资、就业、利润、税收与转移</text></svg>