<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">财政购买的收入反馈轮次</title><desc id="d">MPC0.6下自主购买10产生10、6、3.6、2.16的前四轮，总和25。</desc><rect width="920" height="490" rx="18" fill="#fffdfa" stroke="#dce5e3"/><text x="151" y="112" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#21363c">购买</text><rect x="258" y="80" width="410" height="45" rx="5" fill="#147d80"/><text x="710" y="111" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#21363c">10.00</text><text x="151" y="198" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#21363c">后续1</text><rect x="258" y="166" width="246" height="45" rx="5" fill="#cd7355"/><text x="546" y="197" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#21363c">6.00</text><text x="151" y="284" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#21363c">后续2</text><rect x="258" y="252" width="147.6" height="45" rx="5" fill="#147d80"/><text x="447.6" y="283" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#21363c">3.60</text><text x="151" y="370" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#21363c">后续3</text><rect x="258" y="338" width="88.56" height="45" rx="5" fill="#cd7355"/><text x="388.56" y="369" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#21363c">2.16</text><text x="460" y="460" font-size="#147d80" text-anchor="middle" font-family="system-ui,sans-serif" fill="22">总和 = 10 / (1−0.6) = 25</text></svg>