<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">同一期宏观数据的发布版本</title><desc id="desc">示例GDP同比等数值初报1.8，第二次修正为2.2，第三次为2.0，均为构造数据。</desc><defs><marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker><marker id="orange" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#cd7355"/></marker></defs><rect width="920" height="480" rx="20" fill="#fffdf9"/><rect x="38" y="135" width="252" height="112" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="164" y="178" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#21363c">初值 · 1.8%</text><text x="164" y="212" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#526a70">资料随时间补充</text><path d="M290 192L330 192" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#arrow)"/><rect x="335" y="135" width="252" height="112" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="461" y="178" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#21363c">第二次 · 2.2%</text><text x="461" y="212" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#526a70">资料随时间补充</text><path d="M587 192L627 192" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#arrow)"/><rect x="632" y="135" width="252" height="112" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="758" y="178" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#21363c">第三次 · 2.0%</text><text x="758" y="212" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#526a70">资料随时间补充</text><text x="460" y="342" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#21363c">观察期相同  ≠  发布信息集相同</text><text x="460" y="403" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#5b6d72">图示百分比全部为虚