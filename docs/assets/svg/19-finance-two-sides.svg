<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">国际收支金融账户的净资产负债符号</title><desc id="d">金融资产净取得3、对外负债净发生8，金融账户余额3−8=-5；与CA+KA=-5概念一致。</desc><rect width="920" height="490" rx="20" fill="#fffdfa" stroke="#dce5e3"/><rect x="55" y="101" width="375" height="143" rx="13" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="242.5" y="142" font-size="23" fill="#21363c" text-anchor="middle" font-family="system-ui,sans-serif">对外资产取得</text><text x="242.5" y="178" font-size="16" fill="#5b6d72" text-anchor="middle" font-family="system-ui,sans-serif">净增加 3</text><rect x="491" y="101" width="375" height="143" rx="13" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="678.5" y="142" font-size="23" fill="#21363c" text-anchor="middle" font-family="system-ui,sans-serif">对外负债发生</text><text x="678.5" y="178" font-size="16" fill="#5b6d72" text-anchor="middle" font-family="system-ui,sans-serif">净增加 8</text><text x="460" y="322" font-size="28" fill="#147d80" text-anchor="middle" font-family="system-ui,sans-serif">金融账户 FA = 3 − 8 = −5</text><text x="460" y="408" font-size="18" fill="#5b6d72" text-anchor="middle" font-family="system-ui,sans-serif">对应经济体对外净借款5单位（忽略误差与遗漏）</text></svg>