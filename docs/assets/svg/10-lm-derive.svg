<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="t d"><title id="t">收入增加推动货币需求与LM</title><desc id="d">在实际货币余额固定时，Y500的利率i5，Y600需要i10，多个均衡点形成向上倾斜LM。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147d80"/></marker><marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#cd7355"/></marker></defs><rect width="920" height="480" rx="18" fill="#fffdf9"/><rect x="31" y="80" width="266" height="122" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="164" y="120" fill="#21363c" font-family="sans-serif" font-size="24" text-anchor="middle">Y=500</text><text x="164" y="155" fill="#5b6d72" font-family="sans-serif" font-size="17" text-anchor="middle">kY=250；i=5</text><rect x="331" y="80" width="266" height="122" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="464" y="120" fill="#21363c" font-family="sans-serif" font-size="24" text-anchor="middle">Y=600</text><text x="464" y="155" fill="#5b6d72" font-family="sans-serif" font-size="17" text-anchor="middle">kY=300；i=10</text><rect x="630" y="80" width="260" height="122" rx="14" fill="#f2eff9" stroke="#7660a6" stroke-width="2"/><text x="760" y="120" fill="#21363c" font-family="sans-serif" font-size="24" text-anchor="middle">M/P=200</text><text x="760" y="155" fill="#5b6d72" font-family="sans-serif" font-size="17" text-anchor="middle">固定实际货币供给</text><path d="M453 206L453 272" stroke="#147d80" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M168 394L744 287" stroke="#147d80" stroke-width="5" fill="none"/><text x="460" y="345" fill="#21363c" font-family="sans-serif" font-size="24" text-anchor="middle">LM：产出越高，均衡利率越高</text><text x="460" y="432" fill="#5b6d72" font-family="sans-serif" font-size="17" text-anchor="middle">这是给定M、P与货币需求函数的构造模型</text></svg>