<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">债务比率演算：80.55%</title><desc id="d">初始债务率80%、名义利率5%、名义GDP增长3%和基本盈余率1%，得到80.55%。</desc><rect width="920" height="490" rx="18" fill="#fffdfa" stroke="#dce5e3"/><rect x="40" y="95" width="398" height="131" rx="14" fill="#e3f2ee" stroke="#147d80" stroke-width="2"/><text x="239" y="137" font-size="23" text-anchor="middle" font-family="system-ui,sans-serif" fill="#21363c">初始债务率</text><text x="239" y="172" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#5b6d72">80.00%</text><rect x="485" y="95" width="398" height="131" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="684" y="137" font-size="23" text-anchor="middle" font-family="system-ui,sans-serif" fill="#21363c">名义滚动因素</text><text x="684" y="172" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#5b6d72">1.05/1.03</text><text x="460" y="333" font-size="#147d80" text-anchor="middle" font-family="system-ui,sans-serif" fill="27">80 × (1.05/1.03) − 1 = 80.55%</text><text x="460" y="419" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#21363c">正利差不直接等于不可持续的偿付路径</text></svg>