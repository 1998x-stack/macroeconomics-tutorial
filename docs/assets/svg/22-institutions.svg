<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="t d"><title id="t">知识生产与扩散所依赖的制度生态</title><desc id="d">教育和科研提供知识，融资与企业组织推动商业化，制度与竞争塑造创新回报及扩散。</desc><rect width="920" height="490" rx="20" fill="#fffdf9" stroke="#dce5e3"/><rect x="37" y="85" width="266" height="135" rx="14" fill="#e7f2ef" stroke="#147f80" stroke-width="2"/><text x="170" y="127" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">教育与科研</text><text x="170" y="163" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">技能、研究人员</text><rect x="327" y="85" width="266" height="135" rx="14" fill="#fff0e9" stroke="#d06d4d" stroke-width="2"/><text x="460" y="127" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">企业与融资</text><text x="460" y="163" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">试错、商业化</text><rect x="617" y="85" width="266" height="135" rx="14" fill="#f1eef9" stroke="#7461ba" stroke-width="2"/><text x="750" y="127" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">制度与竞争</text><text x="750" y="163" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">产权、进入、治理</text><text x="460" y="306" font-size="22" text-anchor="middle" font-family="system-ui,sans-serif" fill="#203035">三者互相影响，缺一环都可能限制生产率扩散</text><text x="460" y="394" font-size="18" text-anchor="middle" font-family="system-ui,sans-serif" fill="#53676d">制度不是单一评分，也不是收入差异的唯一解释</text></svg>