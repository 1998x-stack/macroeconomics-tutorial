<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="t d"><title id="t">面包价值链的增加值</title><desc id="d">小麦售价5、面粉10、烘焙出厂20、零售25，增加值分段为5、5、10、5，合计25。</desc><defs><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147d80"/></marker><marker id="rust" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#cd7355"/></marker></defs><rect width="920" height="510" rx="20" fill="#fffdfa" stroke="#dce5e3"/><rect x="23" y="110" width="190" height="134" rx="14" fill="#e5f3f0" stroke="#147d80" stroke-width="2"/><text x="118" y="155" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">小麦</text><text x="118" y="189" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">销售 5</text><text x="118" y="288" font-family="sans-serif" font-size="20" fill="#147d80" text-anchor="middle">增加值 +5</text><path d="M214 177 L248 177" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#teal)"/><rect x="251" y="110" width="190" height="134" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="346" y="155" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">面粉</text><text x="346" y="189" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">销售 10</text><text x="346" y="288" font-family="sans-serif" font-size="20" fill="#cd7355" text-anchor="middle">增加值 +5</text><path d="M442 177 L476 177" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#teal)"/><rect x="479" y="110" width="190" height="134" rx="14" fill="#e5f3f0" stroke="#147d80" stroke-width="2"/><text x="574" y="155" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">面包</text><text x="574" y="189" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">销售 20</text><text x="574" y="288" font-family="sans-serif" font-size="20" fill="#147d80" text-anchor="middle">增加值 +10</text><path d="M670 177 L704 177" fill="none" stroke="#147d80" stroke-width="3" marker-end="url(#teal)"/><rect x="707" y="110" width="190" height="134" rx="14" fill="#fff0e9" stroke="#cd7355" stroke-width="2"/><text x="802" y="155" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="27" fill="#21363c">零售</text><text x="802" y="189" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b6d72">销售 25</text><text x="802" y="288" font-family="sans-serif" font-size="20" fill="#cd7355" text-anchor="middle">增加值 +5</text><rect x="95" y="367" width="730" height="87" rx="13" fill="#e5f3f0"/><text x="460" y="402" font-family="sans-serif" font-size="30" fill="#147d80" text-anchor="middle">5 + 5 + 10 + 5 = 25</text><text x="460" y="431" font-family="sans-serif" font-size="17" fill="#5b6d72" text-anchor="middle">每阶段新增价值之和 = 最终产品价值</text></svg>