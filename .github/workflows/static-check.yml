name: Static and browser QA
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_site.py
      - run: python3 scripts/verify_rbc_baseline.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install playwright
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 scripts/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-browser-screenshots
          path: qa-screenshots/
